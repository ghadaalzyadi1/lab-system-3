<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إضافة جهاز</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-header">
  <button class="back-btn" onclick="history.back()">← رجوع</button>
  <h1>إضافة جهاز جديد</h1>
</div>

<div class="container">
  <div style="display:grid;grid-template-columns:1fr 320px;gap:24px">

    <div>
      <div class="form-card">
        <h2 class="section-title" style="margin-bottom:18px">بيانات الجهاز</h2>
        <div class="form-grid">

          <div class="form-group full">
            <label>كود الجودة * <span id="dept-auto-label" style="color:#16a34a;font-size:12px;font-weight:normal"></span></label>
            <input id="qcode" placeholder="مثال: FCL-HA-634" oninput="onQcodeInput()">
          </div>

          <div class="form-group full">
            <label>اسم الجهاز *</label>
            <input id="name" placeholder="مثال: ماصة LAMBDA PLUS 20-200">
          </div>

          <div class="form-group">
            <label>الرقم التسلسلي *</label>
            <input id="serial" placeholder="مثال: 258250846">
          </div>

          <div class="form-group">
            <label>نوع الجهاز</label>
            <select id="dtype">
              <option value="primary">جهاز رئيسي</option>
              <option value="support">جهاز مساند</option>
            </select>
          </div>

          <div class="form-group">
            <label>القسم <span style="color:#94a3b8;font-size:11px">(يُحدَّد تلقائياً)</span></label>
            <select id="dept"></select>
          </div>

          <div class="form-group">
            <label>تاريخ المعايرة</label>
            <input type="date" id="cal-date">
          </div>

          <div class="form-group">
            <label>تاريخ المعايرة القادمة</label>
            <input type="date" id="next-cal-date">
          </div>

          <div class="form-group full">
            <label>ملاحظات</label>
            <textarea id="notes" placeholder="أي ملاحظات..."></textarea>
          </div>

        </div>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="history.back()">إلغاء</button>
        <button class="btn-primary" onclick="saveDevice()">حفظ الجهاز ✓</button>
      </div>
    </div>

    <!-- QR -->
    <div>
      <div class="form-card">
        <h2 class="section-title" style="margin-bottom:14px">QR Code</h2>
        <div class="qr-box">
          <canvas id="qr-canvas" style="display:none;margin:0 auto;border-radius:8px;display:block"></canvas>
          <div id="qr-placeholder" style="color:#94a3b8;padding:30px 0">
            <div style="font-size:40px">📱</div>
            <p style="margin-top:8px;font-size:13px">يظهر تلقائياً عند الكتابة</p>
          </div>
        </div>
        <button id="dl-btn" onclick="downloadQR()" style="display:none;margin-top:10px;width:100%" class="btn-secondary">⬇️ تحميل QR</button>
        <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;margin-top:10px;font-size:12px;color:#92400e">
          💡 عند مسح الـ QR يفتح ملف الجهاز مباشرة
        </div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// خريطة الأكواد → الأقسام
const CODE_DEPT = { 'HA':'antibiotics','TO':'toxicology','PS':'pesticides','CC':'contaminants','FF':'food-fraud' };
const CODE_NAME = { 'HA':'قسم المضادات الحيوية والهرمونات','TO':'قسم السموم','PS':'قسم المبيدات','CC':'قسم الملوثات الكيميائية','FF':'قسم الغش الغذائي' };

let depts = [];
const canvas = document.getElementById('qr-canvas');

async function init() {
  const { data } = await db.from('departments').select('*');
  depts = data || [];
  const sel = document.getElementById('dept');
  sel.innerHTML = '<option value="">اختر القسم</option>';
  depts.forEach(d => {
    const o = document.createElement('option');
    o.value = d.id; o.textContent = d.name_ar; o.dataset.slug = d.slug;
    sel.appendChild(o);
  });
}
init();

function onQcodeInput() {
  const code = document.getElementById('qcode').value.toUpperCase();
  // استخراج الكود من النمط مثل FCL-HA-634
  for (const [key, slug] of Object.entries(CODE_DEPT)) {
    if (code.includes('-' + key + '-') || code.includes(key + '-') || code.endsWith(key) || code.startsWith(key)) {
      const dept = depts.find(d => d.slug === slug);
      if (dept) {
        document.getElementById('dept').value = dept.id;
        document.getElementById('dept-auto-label').textContent = '✅ تم تحديد ' + CODE_NAME[key] + ' تلقائياً';
      }
      break;
    }
  }
  updateQR();
}

async function updateQR() {
  const name   = document.getElementById('name').value.trim();
  const serial = document.getElementById('serial').value.trim();
  const qcode  = document.getElementById('qcode').value.trim();
  const placeholder = document.getElementById('qr-placeholder');

  if (!name && !serial && !qcode) { placeholder.style.display='block'; canvas.style.display='none'; return; }

  const url = `${location.origin.replace('github.io','github.io')}/${location.pathname.split('/')[1]}/device.html?qc=${encodeURIComponent(qcode||serial)}`;
  const data = JSON.stringify({ name, serial, code: qcode, url });
  await QRCode.toCanvas(canvas, data, { width:190, margin:2 });
  canvas.style.display = 'block';
  placeholder.style.display = 'none';
  document.getElementById('dl-btn').style.display = 'block';
}

document.getElementById('name').addEventListener('input', updateQR);
document.getElementById('serial').addEventListener('input', updateQR);

function downloadQR() {
  const link = document.createElement('a');
  link.download = `QR-${document.getElementById('qcode').value||'device'}.png`;
  link.href = canvas.toDataURL();
  link.click();
}

async function saveDevice() {
  const name   = document.getElementById('name').value.trim();
  const serial = document.getElementById('serial').value.trim();
  const qcode  = document.getElementById('qcode').value.trim();
  if (!name||!serial||!qcode) { alert('يرجى ملء الحقول الإلزامية: كود الجودة، الاسم، الرقم التسلسلي'); return; }

  const btn = event.target; btn.disabled=true; btn.textContent='جاري الحفظ...';

  const qrData = JSON.stringify({ name, serial, code: qcode });
  const { data, error } = await db.from('devices').insert([{
    name, serial_number: serial, quality_code: qcode,
    department_id:         document.getElementById('dept').value || null,
    device_type:           document.getElementById('dtype').value,
    calibration_date:      document.getElementById('cal-date').value      || null,
    next_calibration_date: document.getElementById('next-cal-date').value || null,
    notes:                 document.getElementById('notes').value.trim()   || null,
    qr_data: qrData,
  }]).select();

  if (error) { alert('خطأ: '+error.message); btn.disabled=false; btn.textContent='حفظ الجهاز ✓'; return; }
  location.href = data?.[0]?.id ? `device.html?id=${data[0].id}` : 'index.html';
}
</script>
</body>
</html>

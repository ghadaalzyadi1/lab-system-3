<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const CODE_DEPT={'HA':'antibiotics','TO':'toxicology','PS':'pesticides','CC':'contaminants','FF':'food-fraud'};
const CODE_NAME={'HA':'قسم المضادات الحيوية والهرمونات','TO':'قسم السموم','PS':'قسم المبيدات','CC':'قسم الملوثات الكيميائية','FF':'قسم الغش الغذائي'};

let uploadedFile=null,allDevices=[],allDepts=[],parsedData=null;

async function init(){
  const {data:devs} =await db.from('devices').select('id,name,serial_number,quality_code');
  const {data:depts}=await db.from('departments').select('*');
  allDevices=devs||[];
  allDepts=depts||[];

    sel.appendChild(o);
  });
}
init();

// ══ استخراج النص مع ترتيب السطور ══════════════
async function extractText(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let allLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const vp=page.getViewport({scale:1});
    const items=content.items
      .map(i=>({str:i.str.trim(),x:Math.round(i.transform[4]),y:Math.round(vp.height-i.transform[5])}))
      .filter(i=>i.str.length>0);
    const rows={};
    items.forEach(i=>{
      const key=Math.round(i.y/4)*4;
      if(!rows[key])rows[key]=[];
      rows[key].push(i);
    });
    Object.keys(rows).sort((a,b)=>+a-+b).forEach(key=>{
      const line=rows[key].sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').trim();
      if(line)allLines.push(line);
    });
    allLines.push('---PAGE---');
  }
  return allLines;
}

// ══ القارئ الذكي ═══════════════════════════════
function smartParse(lines){
  const full=lines.join('\n');
  const data={device_name:null,serial_number:null,quality_code:null,
              calibration_date:null,next_calibration_date:null,lab_name:null};

  // ── 1. كود الجودة ──────────────────────────
  const directCode=full.match(/\b([A-Z]{2,6}[-\/](HA|TO|PS|CC|FF)[-\/]\d{2,6})\b/i);
  if(directCode){
    data.quality_code=directCode[1];
  } else {
    for(let i=0;i<lines.length;i++){
      if(/^(Asset\s*ID|UUC\s*ID|Equipment\s*ID|Customer\s*Item\s*ID|Item\s*ID|Tag\s*No|كود الجودة|رقم الجهاز)$/i.test(lines[i])){
        const prev=lines[i-1]?.trim(),next=lines[i+1]?.trim();
        const val=(prev?.match(/^[A-Z]{2,6}[-\/][A-Z0-9]{1,4}[-\/]\d{2,6}$/i)?prev:null)
               ||(next?.match(/^[A-Z]{2,6}[-\/][A-Z0-9]{1,4}[-\/]\d{2,6}$/i)?next:null);
        if(val){data.quality_code=val;break;}
      }
      const m=lines[i].match(/(?:Asset\s*ID|UUC\s*ID|Equipment\s*ID|Customer\s*Item\s*ID)[:\s]+([A-Z0-9\-\/]{4,20})/i);
      if(m){data.quality_code=m[1].trim();break;}
    }
  }

  // ── 2. الرقم التسلسلي ──────────────────────
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/^Serial\s*Number$/i.test(line)){
      const prev=lines[i-1]?.trim();
      if(prev&&/^\d{4,20}$/.test(prev)){data.serial_number=prev;break;}
      const next=lines[i+1]?.trim();
      if(next&&/^[A-Z0-9\-]{4,20}$/i.test(next)&&!/^(CONDITIONS|BALANCE|PASSED|FAILED|Good|N\/A)$/i.test(next)){data.serial_number=next;break;}
    }
    const m1=line.match(/Serial\s*(?:Number|No\.?)[:\s]+([A-Z0-9\-]{4,20})/i);
    if(m1&&!/^(CONDITIONS|BALANCE|PASSED|FAILED)$/i.test(m1[1])){data.serial_number=m1[1].trim();break;}
    const m2=line.match(/^S[\/\.]?N[:\s]+([A-Z0-9\-]{4,20})$/i);
    if(m2){data.serial_number=m2[1].trim();break;}
    const m3=line.match(/\bS\/N[:\s]+([A-Z0-9\-]{4,20})/i);
    if(m3&&!/^(CONDITIONS|BALANCE)$/i.test(m3[1])){data.serial_number=m3[1].trim();break;}
  }
  if(!data.serial_number){
    const m=full.match(/Serial\s*(?:Number|No)?[:\s\n]+(\d{5,15})/i);
    if(m)data.serial_number=m[1].trim();
  }

  // ── 3. اسم الجهاز ──────────────────────────
  const deviceTypes=['Analytical Balance','Semi-Micro Balance','Micro Balance','Balance',
    'Centrifuge','Microcentrifuge','Incubator','CO2 Incubator','Autoclave','Steam Sterilizer',
    'Refrigerator','Freezer','Ultra-Low Freezer','Thermometer','Thermocouple',
    'Pipette','Micropipette','Multichannel Pipette','pH Meter','HPLC','LC-MS','LC-MS/MS',
    'GC-MS','GC','ICP-MS','ICP-OES','AAS','FTIR','UV-Vis Spectrophotometer','Spectrophotometer',
    'Water Bath','Vortex Mixer','Orbital Shaker','Oven','Drying Oven','Laminar Flow','Biosafety Cabinet'];

  const nameLabels=/^(Item\s*Name|Instrument\s*Name|Equipment\s*Name|UUC\s*Description|Device\s*Name|Pipette\s*model|Model\s*\/\s*Type|Type\/Model|اسم الجهاز)$/i;
  for(let i=0;i<lines.length;i++){
    if(nameLabels.test(lines[i])){
      const prev=lines[i-1]?.trim(),next=lines[i+1]?.trim();
      const candidates=[prev,next].filter(v=>v&&v.length>=2&&!/^(N\/A|NA|CONDITIONS|BALANCE|\d+|Good)$/i.test(v)&&!/^\d+\.?\d*$/.test(v));
      if(candidates.length>0){
        const best=candidates.find(c=>deviceTypes.some(t=>c.toLowerCase().includes(t.toLowerCase())))||candidates[0];
        data.device_name=best.substring(0,60);break;
      }
    }
  }
  if(!data.device_name){
    for(const dtype of deviceTypes){
      const re=new RegExp('\\b'+dtype.replace(/[-\/]/g,'[-\\/]')+'[^\\n]{0,30}','i');
      const m=full.match(re);
      if(m){data.device_name=m[0].trim().substring(0,60);break;}
    }
  }

  // ── 4. التواريخ ────────────────────────────
  const calKW=/(?:Calibration\s*Date|Date\s*(?:of\s*)?Calibrat|Calibrat(?:ed|ion)\s*(?:Date|On|Performed)|Issue\s*Date|Date\s*Calibrated|تاريخ\s*المعايرة)/i;
  const nxtKW=/(?:Next\s*(?:Calibration\s*)?(?:Date|Due)|(?:Calibration\s*)?Due\s*Date|Recommended\s*(?:Due|Calibration)\s*Date|Valid\s*Until|Expiry\s*Date|تاريخ\s*المعايرة\s*القادمة)/i;
  const entries=[];
// نمط Calibry: التاريخ فوق التسمية
    // 13.01.2025    6/13/2025
    // Date          Next due
    if(/^Date$/i.test(ln) && i > 0){
      // السطر السابق قد يحتوي تاريخ المعايرة
      const prevLn = lines[i-1]?.trim();
      if(prevLn){
        const euD = prevLn.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if(euD && +euD[3]>=2020 && +euD[3]<=2035){
          entries.push({d:+euD[1],mo:+euD[2],y:+euD[3],type:'cal',conf:99});
        }
        // قد يكون في نفس السطر: "13.01.2025   6/13/2025"
        const twoInPrev = [];
        const euRe2 = /(\d{2})\.(\d{2})\.(\d{4})/g;
        const usRe2 = /(\d{1,2})\/(\d{1,2})\/(\d{4})/g;
        let dm2;
        while((dm2=euRe2.exec(prevLn))!==null){
          const d=+dm2[1],mo=+dm2[2],y=+dm2[3];
          if(y>=2020&&y<=2035)twoInPrev.push({d,mo,y,pos:dm2.index,fmt:'EU'});
        }
        while((dm2=usRe2.exec(prevLn))!==null){
          const mo=+dm2[1],d=+dm2[2],y=+dm2[3];
          if(y>=2020&&y<=2035)twoInPrev.push({d,mo,y,pos:dm2.index,fmt:'US'});
        }
        if(twoInPrev.length>=2){
          twoInPrev.sort((a,b)=>a.pos-b.pos);
          entries.push({...twoInPrev[0],type:'cal', conf:99});
          entries.push({...twoInPrev[1],type:'next',conf:99});
        }
      }
      // ابحث عن "Next due" في سطور قريبة
      for(let k=1;k<=3;k++){
        const nxtLn=lines[i+k]?.trim();
        if(!nxtLn)continue;
        if(/^Next\s*due$/i.test(nxtLn)){
          // السطر قبل "Next due" أو بعده
          const aboveNext=lines[i+k-1]?.trim();
          const usD=aboveNext?.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if(usD){
            const mo=+usD[1],d=+usD[2],y=+usD[3];
            if(y>=2020&&y<=2035)entries.push({d,mo,y,type:'next',conf:99});
          }
          break;
        }
        // التاريخ في نفس السطر مع "Next due"
        if(/Next\s*due/i.test(nxtLn)){
          const usD=nxtLn.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
          const euD=nxtLn.match(/(\d{2})\.(\d{2})\.(\d{4})/);
          if(usD){const mo=+usD[1],d=+usD[2],y=+usD[3];if(y>=2020&&y<=2035)entries.push({d,mo,y,type:'next',conf:99});}
          else if(euD){const d=+euD[1],mo=+euD[2],y=+euD[3];if(y>=2020&&y<=2035)entries.push({d,mo,y,type:'next',conf:99});}
          break;
        }
      }
    }
  // نمط Calibry: "Next due Date Performed by" في سطر واحد
  // يليه: "8/8/2026 09.02.2026 Antibiotic" في سطر واحد
  for(let i=0;i<lines.length;i++){
    const ln=lines[i].trim();
    if(/Next\s*due/i.test(ln)&&/Date/i.test(ln)){
      for(let j=i+1;j<=Math.min(i+5,lines.length-1);j++){
        const s=lines[j].trim();
        if(!s||/^(Repeated|Printed|Certificate|Page|Data|Template|Status|Passed)$/i.test(s))continue;
        const found=[];
        // M/D/YYYY
        const usRe=/(\d{1,2})\/(\d{1,2})\/(\d{4})/g;
        let dm;
        while((dm=usRe.exec(s))!==null){
          const mo=+dm[1],d=+dm[2],y=+dm[3];
          if(y>=2020&&y<=2035&&mo>=1&&mo<=12&&d>=1&&d<=31)
            found.push({d,mo,y,pos:dm.index});
        }
        // DD.MM.YYYY
        const euRe=/(\d{2})\.(\d{2})\.(\d{4})/g;
        while((dm=euRe.exec(s))!==null){
          const d=+dm[1],mo=+dm[2],y=+dm[3];
          if(y>=2020&&y<=2035&&mo>=1&&mo<=12&&d>=1&&d<=31)
            found.push({d,mo,y,pos:dm.index});
        }
        if(found.length>=2){
          found.sort((a,b)=>a.pos-b.pos);
          entries.push({...found[0],type:'next',conf:99});
          entries.push({...found[1],type:'cal', conf:99});
          break;
        } else if(found.length===1){
          entries.push({...found[0],type:'next',conf:95});
        }
      }
      break;
    }

    // نمط "Next due" في سطر وحده
    if(/^Next\s*due$/i.test(ln)){
      const found=[];
      for(let j=i+1;j<=Math.min(i+8,lines.length-1);j++){
        const s=lines[j].trim();
        if(/^(Date|Performed\s*by|Repeated|Printed|Certificate|Page|Data|Template|Status)$/i.test(s))continue;
        const usD=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        const euD=s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if(usD){const mo=+usD[1],d=+usD[2],y=+usD[3];if(y>=2020&&y<=2035)found.push({d,mo,y});}
        else if(euD){const d=+euD[1],mo=+euD[2],y=+euD[3];if(y>=2020&&y<=2035)found.push({d,mo,y});}
        if(found.length>=2)break;
      }
      if(found.length>=1)entries.push({...found[0],type:'next',conf:99});
      if(found.length>=2)entries.push({...found[1],type:'cal', conf:99});
      break;
    }
  }

  // نمط شهادات Quality Compliance: "Calibration Date: DD/MM/YYYY"
  for(let i=0;i<lines.length;i++){
    const ln=lines[i].trim();
    const calInLine=ln.match(/(?:Calibration\s*Date|Date\s*Calibrated|Calibrated\s*(?:On|Date)|Date\s*of\s*Calibration)[:\s]+(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{4})/i);
    if(calInLine){
      const p=calInLine[1].split(/[\/\.\-]/);
      if(+p[2]>2000)entries.push({d:+p[0],mo:+p[1],y:+p[2],type:'cal',conf:98});
    }
    const nxtInLine=ln.match(/(?:Next\s*(?:Calibration\s*)?(?:Date|Due)|(?:Calibration\s*)?Due\s*Date|Recommended\s*Due\s*Date)[:\s]+(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{4})/i);
    if(nxtInLine){
      const p=nxtInLine[1].split(/[\/\.\-]/);
      if(+p[2]>2000)entries.push({d:+p[0],mo:+p[1],y:+p[2],type:'next',conf:98});
    }
    // التسمية في سطر والتاريخ في التالي
    if(calKW.test(ln)&&!calInLine){
      for(let k=1;k<=2;k++){
        const nxt=lines[i+k]?.trim();
        if(!nxt)continue;
        const dm=nxt.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
        if(dm&&+dm[3]>=2020&&+dm[3]<=2035){entries.push({d:+dm[1],mo:+dm[2],y:+dm[3],type:'cal',conf:95});break;}
      }
    }
    if(nxtKW.test(ln)&&!nxtInLine){
      for(let k=1;k<=2;k++){
        const nxt=lines[i+k]?.trim();
        if(!nxt)continue;
        const dm=nxt.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
        if(dm&&+dm[3]>=2020&&+dm[3]<=2035){entries.push({d:+dm[1],mo:+dm[2],y:+dm[3],type:'next',conf:95});break;}
      }
    }
  }

  // بحث عام fallback
  const dateRe=/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})/g;
  let m;
  while((m=dateRe.exec(full))!==null){
    const d=+m[1],mo=+m[2],y=+m[3];
    if(y<2020||y>2035||mo<1||mo>12||d<1||d>31)continue;
    const before=full.substring(Math.max(0,m.index-150),m.index);
    const after=full.substring(m.index,Math.min(full.length,m.index+150));
    let type='unknown',conf=50;
    if(calKW.test(before+after)){type='cal';conf=88;}
    if(nxtKW.test(before+after)){type='next';conf=88;}
    entries.push({d,mo,y,type,conf});
  }

  const calDates =entries.filter(e=>e.type==='cal').sort((a,b)=>b.conf-a.conf);
  const nxtDates =entries.filter(e=>e.type==='next').sort((a,b)=>b.conf-a.conf);
  const unknown  =entries.filter(e=>e.type==='unknown').sort((a,b)=>a.y*10000+a.mo*100+a.d-(b.y*10000+b.mo*100+b.d));

  data.calibration_date=calDates[0]
    ?toISO(calDates[0].d,calDates[0].mo,calDates[0].y)
    :(unknown[0]?toISO(unknown[0].d,unknown[0].mo,unknown[0].y):null);
  data.next_calibration_date=nxtDates[0]
    ?toISO(nxtDates[0].d,nxtDates[0].mo,nxtDates[0].y)
    :(unknown.length>1?toISO(unknown[unknown.length-1].d,unknown[unknown.length-1].mo,unknown[unknown.length-1].y):null);

  // ── 5. جهة الاعتماد ────────────────────────
  for(let i=0;i<lines.length;i++){
    if(/^(Customer\s*Name|Company\s*Name|Client\s*Name)$/i.test(lines[i])){
      const prev=lines[i-1]?.trim(),next=lines[i+1]?.trim();
      const val=[prev,next].find(v=>v&&v.length>=3&&!/^(N\/A|NA|Department|Address|Tel|\d+)$/i.test(v));
      if(val){data.lab_name=val.substring(0,60);break;}
    }
    const m2=lines[i].match(/(?:Customer\s*Name|Company\s*Name)[:\s]+([^\n]{3,60})/i);
    if(m2){data.lab_name=m2[1].trim().substring(0,60);break;}
  }

  return data;
}

// ══ مساعدات ════════════════════════════════════
function toISO(d,mo,y){return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function setProgress(pct,msg){document.getElementById('prog').style.width=pct+'%';document.getElementById('prog-msg').textContent=msg;}

function getDeptFromCode(code){
  if(!code)return null;
  for(const [key,slug] of Object.entries(CODE_DEPT)){
    if(new RegExp('[-\\/\\s]'+key+'[-\\/\\s\\d]|[-\\/\\s]'+key+'$|^'+key+'[-\\/\\s]','i').test(code))
      return {key,slug,name:CODE_NAME[key]};
  }
  return null;
}

function onQcodeChange(){
  const code=document.getElementById('r-qcode').value.toUpperCase();
  const el=document.getElementById('r-dept-label');
  const dept=getDeptFromCode(code);
  el.textContent=dept?('→ '+dept.name):'';
}

// ══ ملء نموذج المراجعة ═════════════════════════
function fillReviewForm(data){
  const setVal=(id,val)=>{
    if(!val)return;
    const el=document.getElementById(id);
    el.value=val;el.classList.add('auto');
  };
  setVal('r-name',   data.device_name);
  setVal('r-serial', data.serial_number);
  setVal('r-qcode',  data.quality_code);
  setVal('r-caldate',data.calibration_date);
  setVal('r-nextdate',data.next_calibration_date);

  const serial=(data.serial_number||'').toLowerCase();
  const qcode=(data.quality_code||'').toLowerCase();
  let matched=null;
  if(serial)matched=allDevices.find(d=>d.serial_number?.toLowerCase()===serial);
  if(!matched&&qcode)matched=allDevices.find(d=>d.quality_code?.toLowerCase()===qcode);

  const sel=document.getElementById('r-device');
  const lbl=document.getElementById('r-match-label');
  if(matched){
    sel.value=matched.id;
    lbl.innerHTML=`<span style="color:#166534;background:#dcfce7;padding:2px 8px;border-radius:12px">✅ ${matched.name}</span>`;
  } else {
    sel.value='NEW';
    lbl.innerHTML=`<span style="color:#1d4ed8;background:#eff6ff;padding:2px 8px;border-radius:12px">➕ جهاز جديد</span>`;
  }
  onQcodeChange();
}

// ══ فتح الإدخال اليدوي ═════════════════════════
function openManualEdit(){
  parsedData={device_name:null,serial_number:null,quality_code:null,
              calibration_date:null,next_calibration_date:null,lab_name:null};
  ['r-name','r-serial','r-qcode','r-caldate','r-nextdate'].forEach(id=>{
    const el=document.getElementById(id);el.value='';el.classList.remove('auto');
  });
  document.getElementById('r-device').value='';
  document.getElementById('r-match-label').innerHTML=`<span style="color:#854d0e;background:#fef9c3;padding:2px 8px;border-radius:12px">✏️ إدخال يدوي</span>`;
  document.getElementById('r-dept-label').textContent='';
  document.getElementById('step-review').style.display='block';
  document.getElementById('result-box').style.display='none';
  document.getElementById('progress-box').style.display='none';
  document.getElementById('step-review').scrollIntoView({behavior:'smooth'});
}

// ══ الحفظ من المراجعة ══════════════════════════
async function saveFromReview(){
  const cal=document.getElementById('r-caldate').value;
  const next=document.getElementById('r-nextdate').value;
  const sel=document.getElementById('r-device').value;
  if(!cal||!next){alert('يرجى إدخال تاريخَي المعايرة');return;}
  if(!sel){alert('يرجى اختيار الجهاز أو إنشاء جديد');return;}

  parsedData={
    device_name:  document.getElementById('r-name').value.trim()||null,
    serial_number:document.getElementById('r-serial').value.trim()||null,
    quality_code: document.getElementById('r-qcode').value.trim()||null,
    calibration_date:cal,
    next_calibration_date:next,
    lab_name:parsedData?.lab_name||null,
  };

  document.getElementById('step-review').style.display='none';
  document.getElementById('progress-box').style.display='block';
  setProgress(50,'جاري الحفظ...');
  await saveDirectly(sel,sel==='NEW');
}

// ══ الحفظ المباشر ══════════════════════════════
async function saveDirectly(deviceId,isNew){
  const data=parsedData;
  setProgress(75,'جاري رفع الشهادة...');

  let certUrl=null;
  if(uploadedFile){
    const folder=isNew?'new-'+Date.now():deviceId;
    const path=`${folder}/${Date.now()}.pdf`;
    const {error}=await db.storage.from('certificates').upload(path,uploadedFile,{upsert:true});
    if(!error){
      const {data:{publicUrl}}=db.storage.from('certificates').getPublicUrl(path);
      certUrl=publicUrl;
    }
  }

  setProgress(90,'جاري حفظ البيانات...');
  const calDate=data.calibration_date||null;
  const nextDate=data.next_calibration_date||null;
  const name=data.device_name||'غير محدد';
  const serial=data.serial_number||null;
  const qcode=data.quality_code||null;
  const lab=data.lab_name||null;
  let finalId=deviceId;

  if(isNew){
    let deptId=null;
    const dept=getDeptFromCode(qcode);
    if(dept){const d=allDepts.find(x=>x.slug===dept.slug);if(d)deptId=d.id;}
    const {data:ins,error}=await db.from('devices').insert([{
      name,serial_number:serial||'SN-'+Date.now(),quality_code:qcode||'',
      department_id:deptId,calibration_date:calDate,next_calibration_date:nextDate,
      certificate_url:certUrl,qr_data:JSON.stringify({name,serial,code:qcode}),
    }]).select();
    if(error)return showError('فشل إنشاء الجهاز: '+error.message);
    finalId=ins?.[0]?.id;
  } else {
    const upd={calibration_date:calDate,next_calibration_date:nextDate};
    if(serial)upd.serial_number=serial;
    if(qcode)upd.quality_code=qcode;
    if(name!=='غير محدد')upd.name=name;
    if(certUrl)upd.certificate_url=certUrl;
    const dept=getDeptFromCode(qcode);
    if(dept){const d=allDepts.find(x=>x.slug===dept.slug);if(d)upd.department_id=d.id;}
    const {error}=await db.from('devices').update(upd).eq('id',deviceId);
    if(error)return showError('فشل التحديث: '+error.message);
  }

  await db.from('calibration_logs').insert([{
    device_id:finalId,calibration_date:calDate,next_calibration_date:nextDate,
    certificate_url:certUrl,notes:lab?`جهة المعايرة: ${lab}`:null,
  }]);

  setProgress(100,'✅ تم الحفظ');
  showSuccess(finalId,isNew);
}

// ══ معالجة الملف ════════════════════════════════
function handleDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(f?.type==='application/pdf')handleFile(f);
  else alert('يرجى رفع PDF فقط');
}

async function handleFile(file){
  uploadedFile=file;
  document.getElementById('upload-area').classList.add('has-file');
  document.getElementById('up-icon').textContent='✅';
  document.getElementById('up-text').textContent=file.name;
  document.getElementById('up-sub').textContent=(file.size/1024).toFixed(0)+' KB';
  document.getElementById('progress-box').style.display='block';
  document.getElementById('result-box').style.display='none';
  document.getElementById('step-review').style.display='none';

  setProgress(10,'جاري قراءة الملف...');
  const lines=await extractText(file);
  const hasText=lines.join(' ').replace(/---PAGE---/g,'').trim().length>50;

  if(!hasText){
    setProgress(100,'PDF صورة — يرجى الإدخال اليدوي');
    setTimeout(()=>{
      document.getElementById('progress-box').style.display='none';
      parsedData={device_name:null,serial_number:null,quality_code:null,
                  calibration_date:null,next_calibration_date:null,lab_name:null};
      document.getElementById('r-device').value='NEW';
      document.getElementById('r-match-label').innerHTML=`<span style="color:#854d0e;background:#fef9c3;padding:2px 8px;border-radius:12px">⚠️ PDF صورة — أدخل البيانات يدوياً</span>`;
      document.getElementById('step-review').style.display='block';
    },400);
    return;
  }

  setProgress(40,'جاري تحليل البيانات...');
  const data=smartParse(lines);
  parsedData=data;

  setProgress(80,'جاري تجهيز نموذج المراجعة...');
  fillReviewForm(data);

  setProgress(100,'✅ جاهز للمراجعة');
  setTimeout(()=>{
    document.getElementById('progress-box').style.display='none';
    document.getElementById('step-review').style.display='block';
  },300);
}

// ══ النتيجة ════════════════════════════════════
function showSuccess(deviceId,isNew){
  document.getElementById('progress-box').style.display='none';
  document.getElementById('result-box').innerHTML=`
    <div class="step-box">
      <div style="background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="font-size:28px">✅</span>
        <div>
          <p style="font-size:15px;font-weight:700;color:#166534">${isNew?'تم إنشاء الجهاز وحفظ الشهادة!':'تم تحديث بيانات الجهاز!'}</p>
          <p style="font-size:12px;color:#16a34a;margin-top:2px">تم تحديث تاريخ المعايرة ومؤشر الحالة تلقائياً</p>
        </div>
      </div>
      <div style="background:#f8fafc;border-radius:8px;padding:14px;font-size:13px;margin-bottom:14px">
        ${[
          ['اسم الجهاز',     parsedData.device_name||'غير محدد'],
          ['الرقم التسلسلي', parsedData.serial_number||'—'],
          ['كود الجودة',     parsedData.quality_code||'—'],
          ['تاريخ المعايرة', parsedData.calibration_date?new Date(parsedData.calibration_date).toLocaleDateString('ar-SA'):'غير محدد'],
          ['المعايرة القادمة',parsedData.next_calibration_date?new Date(parsedData.next_calibration_date).toLocaleDateString('ar-SA'):'غير محدد'],
          ['القسم',          (()=>{const d=getDeptFromCode(parsedData.quality_code);return d?d.name:'—';})()],
        ].map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9"><span style="color:#64748b">${k}</span><span style="font-weight:600">${v}</span></div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-secondary" onclick="resetAll()">📄 رفع شهادة أخرى</button>
        <button class="btn-primary" onclick="location.href='device.html?id=${deviceId}'">← عرض ملف الجهاز</button>
      </div>
    </div>`;
  document.getElementById('result-box').style.display='block';
}

function showError(msg){
  document.getElementById('progress-box').style.display='none';
  document.getElementById('result-box').innerHTML=`
    <div class="step-box">
      <div style="background:#fee2e2;border-radius:10px;padding:14px;color:#991b1b;font-size:14px">❌ ${msg}</div>
      <button class="btn-secondary" style="margin-top:12px" onclick="resetAll()">حاول مرة أخرى</button>
    </div>`;
  document.getElementById('result-box').style.display='block';
}

function resetAll(){
  uploadedFile=null;parsedData=null;
  document.getElementById('upload-area').className='upload-area';
  document.getElementById('up-icon').textContent='📄';
  document.getElementById('up-text').textContent='اضغط أو اسحب ملف PDF هنا';
  document.getElementById('up-sub').textContent='يقبل أي تصميم لشهادة المعايرة';
  document.getElementById('progress-box').style.display='none';
  document.getElementById('prog').style.width='0%';
  document.getElementById('step-review').style.display='none';
  document.getElementById('result-box').style.display='none';
  document.getElementById('result-box').innerHTML='';
  ['r-name','r-serial','r-qcode','r-caldate','r-nextdate'].forEach(id=>{
    const el=document.getElementById(id);el.value='';el.classList.remove('auto');
  });
  document.getElementById('r-device').value='';
  document.getElementById('r-match-label').innerHTML='';
  document.getElementById('r-dept-label').textContent='';
  document.getElementById('pdf-file').value='';
}
</script>

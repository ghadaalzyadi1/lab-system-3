<script src="config.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const CODE_DEPT = {'HA':'antibiotics','TO':'toxicology','PS':'pesticides','CC':'contaminants','FF':'food-fraud'};
const CODE_NAME = {'HA':'قسم المضادات الحيوية والهرمونات','TO':'قسم السموم','PS':'قسم المبيدات','CC':'قسم الملوثات الكيميائية','FF':'قسم الغش الغذائي'};

let uploadedFile=null, allDevices=[], allDepts=[], parsedData=null, autoMatchedId=null;

async function init() {
  const {data:devs}  = await db.from('devices').select('id,name,serial_number,quality_code');
  const {data:depts} = await db.from('departments').select('*');
  allDevices = devs  || [];
  allDepts   = depts || [];
  const sel = document.getElementById('device-select');
  allDevices.forEach(d => {
    const o = document.createElement('option');
    o.value=d.id; o.textContent=`${d.name} — ${d.serial_number}`;
    sel.appendChild(o);
  });
}
init();

// ══════════════════════════════════════════════
//  استخراج النص مع الحفاظ على بنية السطور
// ══════════════════════════════════════════════
async function extractText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let allLines = [];

  for (let p=1; p<=pdf.numPages; p++) {
    const page    = await pdf.getPage(p);
    const content = await page.getTextContent();
    const vp      = page.getViewport({scale:1});

    const items = content.items
      .map(i => ({str:i.str.trim(), x:Math.round(i.transform[4]), y:Math.round(vp.height-i.transform[5])}))
      .filter(i => i.str.length > 0);

    // تجميع في سطور بناءً على Y
    const rows = {};
    items.forEach(i => {
      const key = Math.round(i.y/4)*4;
      if (!rows[key]) rows[key]=[];
      rows[key].push(i);
    });

    Object.keys(rows).sort((a,b)=>+a-+b).forEach(key => {
      const line = rows[key].sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').trim();
      if (line) allLines.push(line);
    });

    allLines.push('---PAGE---');
  }
  return allLines;
}

// ══════════════════════════════════════════════
//  القارئ الذكي
// ══════════════════════════════════════════════
function smartParse(lines) {
  const full = lines.join('\n');
  const data = {
    device_name: null, serial_number: null, quality_code: null,
    calibration_date: null, next_calibration_date: null, lab_name: null,
  };

  // ── كود الجودة ──────────────────────────────
  // النمط المباشر XXX-YY-NNN
  const directCode = full.match(/\b([A-Z]{2,6}[-\/](HA|TO|PS|CC|FF)[-\/]\d{2,6})\b/i);
  if (directCode) {
    data.quality_code = directCode[1];
  } else {
    // ابحث قبل وبعد التسميات
    for (let i=0; i<lines.length; i++) {
      if (/^(Asset\s*ID|UUC\s*ID|Equipment\s*ID|Customer\s*Item\s*ID|Item\s*ID|Tag\s*No|كود الجودة|رقم الجهاز)$/i.test(lines[i])) {
        const prev = lines[i-1]?.trim();
        const next = lines[i+1]?.trim();
        const val  = (prev?.match(/^[A-Z]{2,6}[-\/][A-Z0-9]{1,4}[-\/]\d{2,6}$/i) ? prev : null)
                  || (next?.match(/^[A-Z]{2,6}[-\/][A-Z0-9]{1,4}[-\/]\d{2,6}$/i) ? next : null);
        if (val) { data.quality_code = val; break; }
      }
      // في نفس السطر بعد ":"
      const m = lines[i].match(/(?:Asset\s*ID|UUC\s*ID|Equipment\s*ID|Customer\s*Item\s*ID)[:\s]+([A-Z0-9\-\/]{4,20})/i);
      if (m) { data.quality_code = m[1].trim(); break; }
    }
  }

  // ── الرقم التسلسلي ──────────────────────────
  for (let i=0; i<lines.length; i++) {
    const line = lines[i];

    // في شهادة Calibry: القيمة تأتي قبل "Serial Number"
    if (/^Serial\s*Number$/i.test(line)) {
      const prev = lines[i-1]?.trim();
      if (prev && /^\d{4,20}$/.test(prev)) { data.serial_number = prev; break; }
      const next = lines[i+1]?.trim();
      if (next && /^[A-Z0-9\-]{4,20}$/i.test(next) && !/^(CONDITIONS|BALANCE|PASSED|FAILED|Good|N\/A)$/i.test(next)) {
        data.serial_number = next; break;
      }
    }

    // في نفس السطر
    const m1 = line.match(/Serial\s*(?:Number|No\.?)[:\s]+([A-Z0-9\-]{4,20})/i);
    if (m1 && !/^(CONDITIONS|BALANCE|PASSED|FAILED)$/i.test(m1[1])) { data.serial_number = m1[1].trim(); break; }

    const m2 = line.match(/^S[\/\.]?N[:\s]+([A-Z0-9\-]{4,20})$/i);
    if (m2) { data.serial_number = m2[1].trim(); break; }

    // S/N: في سطر عادي
    const m3 = line.match(/\bS\/N[:\s]+([A-Z0-9\-]{4,20})/i);
    if (m3 && !/^(CONDITIONS|BALANCE)$/i.test(m3[1])) { data.serial_number = m3[1].trim(); break; }
  }

  // fallback رقم تسلسلي
  if (!data.serial_number) {
    const m = full.match(/Serial\s*(?:Number|No)?[:\s\n]+(\d{5,15})/i);
    if (m) data.serial_number = m[1].trim();
  }

  // ── اسم الجهاز ──────────────────────────────
  // أسماء الأجهزة الشائعة
  const deviceTypes = [
    'Analytical Balance','Semi-Micro Balance','Micro Balance','Balance',
    'Centrifuge','Microcentrifuge',
    'Incubator','CO2 Incubator',
    'Autoclave','Steam Sterilizer',
    'Refrigerator','Freezer','Ultra-Low Freezer',
    'Thermometer','Thermocouple',
    'Pipette','Micropipette','Multichannel Pipette',
    'pH Meter','pH electrode',
    'HPLC','LC-MS','LC-MS/MS','GC-MS','GC','ICP-MS','ICP-OES','AAS',
    'FTIR','UV-Vis Spectrophotometer','Spectrophotometer',
    'Water Bath','Heating Block',
    'Vortex Mixer','Orbital Shaker','Magnetic Stirrer',
    'Oven','Drying Oven','Muffle Furnace',
    'Laminar Flow','Biosafety Cabinet',
    'Microscope','Analytical Instrument',
    'Viscometer','Osmometer','Karl Fischer',
  ];

  const nameLabels = /^(Item\s*Name|Instrument\s*Name|Equipment\s*Name|UUC\s*Description|Device\s*Name|Pipette\s*model|Model\s*\/\s*Type|Type\/Model|اسم الجهاز|وصف الجهاز)$/i;
  const descLabels = /^(Description|Instrument\s*Type|Equipment\s*Type)$/i;

  for (let i=0; i<lines.length; i++) {
    if (nameLabels.test(lines[i]) || descLabels.test(lines[i])) {
      const prev = lines[i-1]?.trim();
      const next = lines[i+1]?.trim();
      const candidates = [prev, next].filter(v => v && v.length>=2 && !/^(N\/A|NA|CONDITIONS|BALANCE|\d+|Good|Defect)$/i.test(v) && !/^\d+\.?\d*$/.test(v));
      if (candidates.length > 0) {
        // رتّب الأولوية: القيمة الأقرب لنوع جهاز معروف
        const best = candidates.find(c => deviceTypes.some(t => c.toLowerCase().includes(t.toLowerCase()))) || candidates[0];
        data.device_name = best.substring(0,60); break;
      }
      // في نفس السطر
      const m = lines[i].match(/(?:Item\s*Name|Description|Model)[:\s]+(.{3,50})/i);
      if (m) { data.device_name = m[1].trim().substring(0,60); break; }
    }
  }

  // fallback: ابحث عن نوع جهاز في النص
  if (!data.device_name) {
    for (const dtype of deviceTypes) {
      // ابحث عن النوع مصحوباً بمعلومات إضافية
      const re = new RegExp('\\b' + dtype.replace(/[-\/]/g,'[-\\/]') + '[^\\n]{0,30}', 'i');
      const m  = full.match(re);
      if (m) { data.device_name = m[0].trim().substring(0,60); break; }
    }
  }

// ── التواريخ ─────────────────────────────────
  const calKeywords  = /(?:Calibration\s*Date|Date\s*(?:of\s*)?Calibrat|Calibrat(?:ed|ion)\s*(?:Date|On|Performed)|Issue\s*Date|Date\s*Calibrated|تاريخ\s*المعايرة)/i;
  const nextKeywords = /(?:Next\s*(?:Calibration\s*)?(?:Date|Due)|(?:Calibration\s*)?Due\s*Date|Recommended\s*(?:Due|Calibration)\s*Date|Valid\s*Until|Expiry\s*Date|تاريخ\s*المعايرة\s*القادمة)/i;

  const dateEntries = [];

  // ── نمط شهادة Calibry: "Next due" ثم "Date" ثم "Performed by" ثم كل تاريخ في سطر منفصل
  for (let i=0; i<lines.length; i++) {
    if (/^Next\s*due$/i.test(lines[i].trim())) {
      // ابحث عن السطور التالية التي تحتوي تواريخ
      let nextFound = false, calFound = false;
      for (let j=i+1; j<=Math.min(i+6, lines.length-1); j++) {
        const ln = lines[j].trim();
        // تجاهل التسميات
        if (/^(Date|Performed\s*by|Repeated|Printed|Data\s*from|Template|Certificate)$/i.test(ln)) continue;
        // هل هذا تاريخ؟
        const dm = ln.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
        if (dm) {
          const d=+dm[1], mo=+dm[2], y=+dm[3];
          if (y>=2020 && y<=2035 && mo>=1 && mo<=12 && d>=1 && d<=31) {
            if (!nextFound) {
              // أول تاريخ = Next due
              dateEntries.push({d, mo, y, type:'next', conf:99});
              nextFound = true;
            } else if (!calFound) {
              // ثاني تاريخ = Date المعايرة
              dateEntries.push({d, mo, y, type:'cal', conf:99});
              calFound = true;
              break;
            }
          }
        }
      }
      break;
    }
  }

  // ── نمط "Calibration Date: DD/MM/YYYY" أو "Date Calibrated: ..."
  for (let i=0; i<lines.length; i++) {
    const ln = lines[i].trim();

    // تاريخ المعايرة في نفس السطر
    const calInLine = ln.match(/(?:Calibration\s*Date|Date\s*Calibrated|Calibrated\s*Date|Date\s*of\s*Calibration|Calibration\s*Performed\s*On)[:\s]+(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{4})/i);
    if (calInLine) {
      const p = calInLine[1].split(/[\/\.\-]/);
      if (+p[2]>2000) dateEntries.push({d:+p[0],mo:+p[1],y:+p[2],type:'cal',conf:98});
    }

    // تاريخ القادمة في نفس السطر
    const nextInLine = ln.match(/(?:Next\s*(?:Calibration\s*)?(?:Date|Due)|(?:Calibration\s*)?Due\s*Date|Recommended\s*Due\s*Date)[:\s]+(\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{4})/i);
    if (nextInLine) {
      const p = nextInLine[1].split(/[\/\.\-]/);
      if (+p[2]>2000) dateEntries.push({d:+p[0],mo:+p[1],y:+p[2],type:'next',conf:98});
    }

    // التسمية في سطر والتاريخ في السطر التالي
    if (calKeywords.test(ln) && !calInLine) {
      for (let k=1; k<=2; k++) {
        const nxt = lines[i+k]?.trim();
        if (!nxt) continue;
        const dm = nxt.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
        if (dm && +dm[3]>=2020 && +dm[3]<=2035) {
          dateEntries.push({d:+dm[1],mo:+dm[2],y:+dm[3],type:'cal',conf:95});
          break;
        }
      }
    }
    if (nextKeywords.test(ln) && !nextInLine) {
      for (let k=1; k<=2; k++) {
        const nxt = lines[i+k]?.trim();
        if (!nxt) continue;
        const dm = nxt.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);
        if (dm && +dm[3]>=2020 && +dm[3]<=2035) {
          dateEntries.push({d:+dm[1],mo:+dm[2],y:+dm[3],type:'next',conf:95});
          break;
        }
      }
    }
  }

  // ── بحث عام كـ fallback
  const dateRe = /(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})/g;
  let m;
  while ((m=dateRe.exec(full))!==null) {
    const d=+m[1],mo=+m[2],y=+m[3];
    if (y<2020||y>2035||mo<1||mo>12||d<1||d>31) continue;
    const before=full.substring(Math.max(0,m.index-150),m.index);
    const after=full.substring(m.index,Math.min(full.length,m.index+150));
    let type='unknown', conf=50;
    if (calKeywords.test(before+after))  {type='cal'; conf=90;}
    if (nextKeywords.test(before+after)) {type='next';conf=90;}
    dateEntries.push({d,mo,y,type,conf});
  }

  // نمط YYYY-MM-DD
  const dateRe2 = /(\d{4})[\/\-](\d{2})[\/\-](\d{2})/g;
  while ((m=dateRe2.exec(full))!==null) {
    const y=+m[1],mo=+m[2],d=+m[3];
    if (y<2020||y>2035||mo<1||mo>12||d<1||d>31) continue;
    const before=full.substring(Math.max(0,m.index-150),m.index);
    const after=full.substring(m.index,Math.min(full.length,m.index+150));
    let type='unknown',conf=50;
    if (calKeywords.test(before+after))  {type='cal'; conf=90;}
    if (nextKeywords.test(before+after)) {type='next';conf=90;}
    dateEntries.push({d,mo,y,type,conf});
  }

  // اختيار أفضل تاريخ (الأعلى ثقة)
  const calDates  = dateEntries.filter(e=>e.type==='cal').sort((a,b)=>b.conf-a.conf);
  const nextDates = dateEntries.filter(e=>e.type==='next').sort((a,b)=>b.conf-a.conf);
  const unknown2  = dateEntries.filter(e=>e.type==='unknown')
    .sort((a,b)=>a.y*10000+a.mo*100+a.d-(b.y*10000+b.mo*100+b.d));

  data.calibration_date      = calDates[0]
    ? toISO(calDates[0].d, calDates[0].mo, calDates[0].y)
    : (unknown2[0] ? toISO(unknown2[0].d, unknown2[0].mo, unknown2[0].y) : null);

  data.next_calibration_date = nextDates[0]
    ? toISO(nextDates[0].d, nextDates[0].mo, nextDates[0].y)
    : (unknown2.length>1 ? toISO(unknown2[unknown2.length-1].d, unknown2[unknown2.length-1].mo, unknown2[unknown2.length-1].y) : null);

  // ── جهة الاعتماد ─────────────────────────────
  for (let i=0; i<lines.length; i++) {
    if (/^(Customer\s*Name|Company\s*Name|Client\s*Name)$/i.test(lines[i])) {
      const prev = lines[i-1]?.trim();
      const next = lines[i+1]?.trim();
      const val  = [prev,next].find(v=>v&&v.length>=3&&!/^(N\/A|NA|Department|Address|Tel|\d+)$/i.test(v));
      if (val) { data.lab_name = val.substring(0,60); break; }
    }
    const m2 = lines[i].match(/(?:Customer\s*Name|Company\s*Name)[:\s]+([^\n]{3,60})/i);
    if (m2) { data.lab_name = m2[1].trim().substring(0,60); break; }
  }

  return data;
}

// ══════════════════════════════════════════════
//  تحديد القسم من الكود
// ══════════════════════════════════════════════
function getDeptFromCode(code) {
  if (!code) return null;
  for (const [key, slug] of Object.entries(CODE_DEPT)) {
    if (new RegExp('[-\\/\\s]'+key+'[-\\/\\s\\d]|[-\\/\\s]'+key+'$|^'+key+'[-\\/\\s]','i').test(code))
      return { key, slug, name: CODE_NAME[key] };
  }
  return null;
}

// ══════════════════════════════════════════════
//  الحفظ المباشر
// ══════════════════════════════════════════════
async function saveDirectly(deviceId, isNewDevice) {
  const data = parsedData;
  setProgress(85, 'جاري رفع الشهادة...');

  // رفع PDF
  let certUrl = null;
  if (uploadedFile) {
    const folder = isNewDevice ? 'new-'+Date.now() : deviceId;
    const path   = `${folder}/${Date.now()}.pdf`;
    const {error} = await db.storage.from('certificates').upload(path, uploadedFile, {upsert:true});
    if (!error) {
      const {data:{publicUrl}} = db.storage.from('certificates').getPublicUrl(path);
      certUrl = publicUrl;
    }
  }

  setProgress(92, 'جاري حفظ البيانات...');

  const calDate  = data.calibration_date      || null;
  const nextDate = data.next_calibration_date || null;
  const name     = data.device_name           || 'غير محدد';
  const serial   = data.serial_number         || null;
  const qcode    = data.quality_code          || null;
  const lab      = data.lab_name              || null;

  let finalId = deviceId;

  if (isNewDevice) {
    // تحديد القسم
    let deptId = null;
    const dept = getDeptFromCode(qcode);
    if (dept) {
      const d = allDepts.find(x=>x.slug===dept.slug);
      if (d) deptId = d.id;
    }

    const {data:inserted, error} = await db.from('devices').insert([{
      name,
      serial_number:         serial || 'SN-'+Date.now(),
      quality_code:          qcode  || '',
      department_id:         deptId,
      calibration_date:      calDate,
      next_calibration_date: nextDate,
      certificate_url:       certUrl,
      qr_data: JSON.stringify({name, serial, code:qcode}),
    }]).select();

    if (error) return showError('فشل إنشاء الجهاز: '+error.message);
    finalId = inserted?.[0]?.id;

  } else {
    // تحديث الجهاز الموجود
    const updateObj = {
      calibration_date:      calDate,
      next_calibration_date: nextDate,
    };
    if (serial) updateObj.serial_number   = serial;
    if (qcode)  updateObj.quality_code    = qcode;
    if (name !== 'غير محدد') updateObj.name = name;
    if (certUrl) updateObj.certificate_url = certUrl;

    // تحديث القسم إن وجد
    const dept = getDeptFromCode(qcode);
    if (dept) {
      const d = allDepts.find(x=>x.slug===dept.slug);
      if (d) updateObj.department_id = d.id;
    }

    const {error} = await db.from('devices').update(updateObj).eq('id', deviceId);
    if (error) return showError('فشل التحديث: '+error.message);
  }

  // إضافة للسجل
  await db.from('calibration_logs').insert([{
    device_id:             finalId,
    calibration_date:      calDate,
    next_calibration_date: nextDate,
    certificate_url:       certUrl,
    notes: lab ? `جهة المعايرة: ${lab}` : null,
  }]);

  setProgress(100, '✅ تم الحفظ');
  showSuccess(finalId, isNewDevice);
}

async function confirmAndSave() {
  const sel = document.getElementById('device-select').value;
  if (!sel) { alert('يرجى اختيار الجهاز أو إنشاء جديد'); return; }
  document.getElementById('step-manual').style.display='none';
  await saveDirectly(sel, sel==='NEW');
}

// ══════════════════════════════════════════════
//  العملية الكاملة
// ══════════════════════════════════════════════
function handleDrop(e) {
  e.preventDefault(); e.currentTarget.classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if (f?.type==='application/pdf') handleFile(f);
  else alert('يرجى رفع PDF فقط');
}

async function handleFile(file) {
  uploadedFile = file;
  document.getElementById('upload-area').classList.add('has-file');
  document.getElementById('up-icon').textContent='✅';
  document.getElementById('up-text').textContent=file.name;
  document.getElementById('up-sub').textContent=(file.size/1024).toFixed(0)+' KB';
  document.getElementById('progress-box').style.display='block';
  document.getElementById('result-box').style.display='none';
  document.getElementById('step-manual').style.display='none';

  setProgress(10,'جاري قراءة الملف...');
  const lines = await extractText(file);
  const fullText = lines.join(' ');

  // تحقق إن كان النص فارغاً (PDF صورة)
  const hasText = fullText.replace(/---PAGE---/g,'').trim().length > 50;

  if (!hasText) {
    // PDF صورة — اعرض نموذج إدخال يدوي
    setProgress(100,'الملف يحتوي صور فقط');
    setTimeout(()=>{
      document.getElementById('progress-box').style.display='none';
      showManualForm();
    }, 400);
    return;
  }

  setProgress(40,'جاري تحليل البيانات...');
  parsedData = smartParse(lines);

  setProgress(65,'جاري البحث عن الجهاز...');

  const serial = (parsedData.serial_number||'').toLowerCase().trim();
  const qcode  = (parsedData.quality_code||'').toLowerCase().trim();

  let matched = null;
  if (serial) matched = allDevices.find(d=>d.serial_number?.toLowerCase()===serial);
  if (!matched && qcode) matched = allDevices.find(d=>d.quality_code?.toLowerCase()===qcode);

  if (matched) {
    await saveDirectly(matched.id, false);
  } else {
    setProgress(80,'لم يُعثر على جهاز مطابق...');
    setTimeout(()=>{
      document.getElementById('progress-box').style.display='none';
      const div = document.getElementById('match-info');
      div.innerHTML=`
        <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;font-size:13px;color:#92400e;margin-bottom:10px">
          ⚠️ لم يُعثر على جهاز مطابق للكود <strong>${parsedData.quality_code||'—'}</strong> أو الرقم التسلسلي <strong>${parsedData.serial_number||'—'}</strong>
        </div>`;
      document.getElementById('step-manual').style.display='block';
    },400);
  }
}
  function showManualForm() {
  document.getElementById('result-box').innerHTML = `
    <div class="step-box">
      <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#92400e">
        ⚠️ هذا الملف يحتوي على صور فقط ولا يمكن قراءة نصه تلقائياً.<br>
        يرجى إدخال البيانات يدوياً ثم الحفظ.
      </div>
      <div class="fields-grid">
        <div class="field-wrap" style="grid-column:1/-1">
          <label>كود الجودة *</label>
          <input id="m-qcode" type="text" placeholder="مثال: FCL-HA-634" oninput="detectDeptManual()">
          <span id="m-dept" style="font-size:12px;color:#16a34a;margin-top:2px"></span>
        </div>
        <div class="field-wrap">
          <label>الرقم التسلسلي</label>
          <input id="m-serial" type="text" placeholder="—">
        </div>
        <div class="field-wrap">
          <label>اسم الجهاز</label>
          <input id="m-name" type="text" placeholder="—">
        </div>
        <div class="field-wrap">
          <label>تاريخ المعايرة *</label>
          <input id="m-caldate" type="date">
        </div>
        <div class="field-wrap">
          <label>تاريخ المعايرة القادمة *</label>
          <input id="m-nextdate" type="date">
        </div>
        <div class="field-wrap" style="grid-column:1/-1">
          <label>اختر الجهاز</label>
          <select id="m-device" style="padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;direction:rtl;font-family:inherit;width:100%;outline:none">
            <option value="">— اختر جهاز موجود —</option>
            <option value="NEW">➕ إنشاء جهاز جديد</option>
            ${allDevices.map(d=>`<option value="${d.id}">${d.name} — ${d.serial_number}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn-secondary" onclick="resetAll()">🔄 رفع ملف آخر</button>
        <button class="btn-primary" onclick="saveManual()">💾 حفظ</button>
      </div>
    </div>`;
  document.getElementById('result-box').style.display='block';
}

function detectDeptManual() {
  const code = document.getElementById('m-qcode').value.toUpperCase();
  const el   = document.getElementById('m-dept');
  for (const [key,name] of Object.entries(CODE_NAME)) {
    if (new RegExp('[-\\/\\s]'+key+'[-\\/\\s\\d]|[-\\/\\s]'+key+'$|^'+key+'[-\\/\\s]','i').test(code)) {
      el.textContent = '✅ '+name; return;
    }
  }
  el.textContent='';
}

async function saveManual() {
  const cal  = document.getElementById('m-caldate').value;
  const next = document.getElementById('m-nextdate').value;
  const sel  = document.getElementById('m-device').value;
  if (!cal||!next) { alert('يرجى إدخال تاريخَي المعايرة'); return; }

  parsedData = {
    device_name:           document.getElementById('m-name').value.trim()||null,
    serial_number:         document.getElementById('m-serial').value.trim()||null,
    quality_code:          document.getElementById('m-qcode').value.trim()||null,
    calibration_date:      cal,
    next_calibration_date: next,
    lab_name: null,
  };

  // مطابقة تلقائية بالكود أو الرقم
  let deviceId = sel;
  let isNew    = sel==='NEW';

  if (!sel) {
    const serial = parsedData.serial_number?.toLowerCase();
    const qcode  = parsedData.quality_code?.toLowerCase();
    let matched  = null;
    if (serial) matched = allDevices.find(d=>d.serial_number?.toLowerCase()===serial);
    if (!matched&&qcode) matched = allDevices.find(d=>d.quality_code?.toLowerCase()===qcode);
    if (matched) { deviceId=matched.id; isNew=false; }
    else { deviceId='NEW'; isNew=true; }
  }

  document.getElementById('result-box').innerHTML='<div class="step-box"><p style="color:#64748b;font-size:14px">جاري الحفظ...</p></div>';
  await saveDirectly(deviceId, isNew);
}
function showSuccess(deviceId, isNew) {
  document.getElementById('progress-box').style.display='none';
  document.getElementById('result-box').innerHTML=`
    <div class="step-box">
      <div style="background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="font-size:28px">✅</span>
        <div>
          <p style="font-size:15px;font-weight:700;color:#166534">${isNew?'تم إنشاء الجهاز وحفظ الشهادة!':'تم تحديث بيانات الجهاز!'}</p>
          <p style="font-size:12px;color:#16a34a;margin-top:2px">تم تحديث تاريخ المعايرة ومؤشر الحالة تلقائياً</p>
        </div>
      </div>
      <div style="background:#f8fafc;border-radius:8px;padding:14px;font-size:13px;margin-bottom:14px">
        ${[
          ['اسم الجهاز', parsedData.device_name||'غير محدد'],
          ['الرقم التسلسلي', parsedData.serial_number||'—'],
          ['كود الجودة', parsedData.quality_code||'—'],
          ['تاريخ المعايرة', parsedData.calibration_date ? new Date(parsedData.calibration_date).toLocaleDateString('ar-SA') : 'غير محدد'],
          ['المعايرة القادمة', parsedData.next_calibration_date ? new Date(parsedData.next_calibration_date).toLocaleDateString('ar-SA') : 'غير محدد'],
          ['القسم', (()=>{const d=getDeptFromCode(parsedData.quality_code);return d?d.name:'—';})()],
        ].map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9"><span style="color:#64748b">${k}</span><span style="font-weight:600">${v}</span></div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-secondary" onclick="resetAll()">📄 رفع شهادة أخرى</button>
        <button class="btn-primary" onclick="location.href='device.html?id=${deviceId}'">← عرض ملف الجهاز</button>
      </div>
    </div>`;
  document.getElementById('result-box').style.display='block';
}

function showError(msg) {
  document.getElementById('progress-box').style.display='none';
  document.getElementById('result-box').innerHTML=`
    <div class="step-box">
      <div style="background:#fee2e2;border-radius:10px;padding:14px;color:#991b1b;font-size:14px">❌ ${msg}</div>
      <button class="btn-secondary" style="margin-top:12px" onclick="resetAll()">حاول مرة أخرى</button>
    </div>`;
  document.getElementById('result-box').style.display='block';
}

function toISO(d,mo,y) {
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function setProgress(pct,msg) {
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-msg').textContent=msg;
}

function resetAll() {
  uploadedFile=null; parsedData=null; autoMatchedId=null;
  document.getElementById('upload-area').className='upload-area';
  document.getElementById('up-icon').textContent='📄';
  document.getElementById('up-text').textContent='اضغط أو اسحب ملف PDF هنا';
  document.getElementById('up-sub').textContent='يقبل أي تصميم لشهادة المعايرة';
  document.getElementById('progress-box').style.display='none';
  document.getElementById('prog').style.width='0%';
  document.getElementById('step-manual').style.display='none';
  document.getElementById('result-box').style.display='none';
  document.getElementById('result-box').innerHTML='';
  document.getElementById('device-select').value='';
  document.getElementById('pdf-file').value='';
}
</script>

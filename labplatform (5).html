<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة إدارة أجهزة المختبر والمعايرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ===== Lab Calibration Management Platform — Modern RTL Theme ===== */
:root{
  --bg:#0f172a;            /* deep slate for sidebar */
  --bg-soft:#f1f5f9;       /* app background */
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --border:#e2e8f0;
  --text:#0f172a;
  --text-soft:#64748b;
  --text-mute:#94a3b8;
  --primary:#2563eb;
  --primary-d:#1d4ed8;
  --primary-soft:#eff6ff;
  --green:#16a34a;  --green-soft:#dcfce7;
  --amber:#d97706;  --amber-soft:#fef3c7;
  --red:#dc2626;    --red-soft:#fee2e2;
  --purple:#7c3aed; --purple-soft:#ede9fe;
  --radius:14px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
  --shadow-lg:0 12px 40px rgba(15,23,42,.14);
  --font:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg-soft);color:var(--text);font-size:14px;line-height:1.6;direction:rtl}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;background:var(--bg);color:#cbd5e1;flex-shrink:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.sidebar .brand{padding:22px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e293b}
.sidebar .brand .logo{font-size:26px}
.sidebar .brand h1{font-size:16px;color:#fff;font-weight:700;line-height:1.3}
.sidebar .brand p{font-size:11px;color:#64748b}
.nav{padding:12px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;letter-spacing:1px;color:#475569;text-transform:uppercase;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:500;transition:.15s;margin-bottom:2px}
.nav a .ico{font-size:17px;width:22px;text-align:center}
.nav a:hover{background:#1e293b;color:#e2e8f0}
.nav a.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.4)}
.nav a .pill{margin-inline-start:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
.sidebar .userbox{padding:14px 16px;border-top:1px solid #1e293b;display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.userbox .meta{flex:1;min-width:0}
.userbox .meta b{color:#fff;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox .meta span{font-size:11px;color:#64748b}
.userbox button{background:none;border:none;color:#64748b;font-size:18px;padding:6px}
.userbox button:hover{color:#f87171}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:30}
.topbar .menu-toggle{display:none;background:none;border:none;font-size:22px}
.topbar h2{font-size:18px;font-weight:700;flex-shrink:0}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:10px 40px 10px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;background:var(--surface-2);outline:none}
.search input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
.search .si{position:absolute;top:50%;transform:translateY(-50%);right:13px;color:var(--text-mute)}
.search-results{position:absolute;top:calc(100% + 6px);right:0;left:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:50;max-height:380px;overflow-y:auto;display:none}
.search-results a{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;border-bottom:1px solid var(--surface-2)}
.search-results a:hover{background:var(--surface-2)}
.content{padding:28px;max-width:1280px;width:100%;margin:0 auto}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ===== Cards / Stats ===== */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800}
.page-head p{color:var(--text-soft);margin-top:3px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .icon{position:absolute;top:16px;left:16px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.stat .label{font-size:13px;color:var(--text-soft);font-weight:600}
.stat .num{font-size:34px;font-weight:800;margin-top:6px;line-height:1}
.stat .sub{font-size:12px;color:var(--text-mute);margin-top:6px}
.stat.blue .icon{background:var(--primary-soft);color:var(--primary)}
.stat.green .icon{background:var(--green-soft);color:var(--green)}
.stat.amber .icon{background:var(--amber-soft);color:var(--amber)}
.stat.red .icon{background:var(--red-soft);color:var(--red)}
.stat.blue{border-top:3px solid var(--primary)} .stat.green{border-top:3px solid var(--green)}
.stat.amber{border-top:3px solid var(--amber)} .stat.red{border-top:3px solid var(--red)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-head h3{font-size:16px;font-weight:700}
.card-body{padding:20px}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}

/* ===== Department cards ===== */
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.dept-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:.18s;border-top:4px solid var(--primary);display:block}
.dept-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.dept-card .dico{font-size:34px}
.dept-card h3{font-size:17px;margin:12px 0 2px;font-weight:700}
.dept-card .en{font-size:12px;color:var(--text-mute)}
.dept-card .row{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
.dept-card .row span{font-size:12px;color:var(--text-soft)}
.dept-card .row b{font-size:18px;color:var(--text);display:block}

/* ===== Badges ===== */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:30px;white-space:nowrap}
.badge.valid{background:var(--green-soft);color:var(--green)}
.badge.soon{background:var(--amber-soft);color:var(--amber)}
.badge.expired{background:var(--red-soft);color:var(--red)}
.badge.unknown{background:#e2e8f0;color:#475569}
.badge.main{background:var(--primary-soft);color:var(--primary)}
.badge.supporting{background:var(--purple-soft);color:var(--purple)}
.badge.cond-operational{background:var(--green-soft);color:var(--green)}
.badge.cond-maintenance{background:var(--amber-soft);color:var(--amber)}
.badge.cond-out_of_service{background:var(--red-soft);color:var(--red)}

/* ===== Tables ===== */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:right;padding:12px 14px;background:var(--surface-2);color:var(--text-soft);font-weight:700;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
table.tbl tr:hover td{background:var(--surface-2)}
table.tbl tr:last-child td{border-bottom:none}
.tbl .code{font-family:"Courier New",monospace;font-weight:700;color:var(--primary)}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--text-soft)}
.field input,.field select,.field textarea{padding:10px 13px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;background:var(--surface-2);outline:none;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
.field .hint{font-size:11px;color:var(--text-mute)}
.field.req label::after{content:" *";color:var(--red)}

/* ===== Filters / chips ===== */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:8px 15px;border-radius:30px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-soft)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== Alerts list ===== */
.alert-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--surface-2);margin-bottom:8px;border-right:3px solid var(--border)}
.alert-item.expired{border-right-color:var(--red);background:var(--red-soft)}
.alert-item.soon{border-right-color:var(--amber);background:var(--amber-soft)}
.alert-item .ai-name{font-weight:700;font-size:13.5px}
.alert-item .ai-meta{font-size:12px;color:var(--text-soft)}
.alert-item .ai-date{margin-inline-start:auto;font-size:12.5px;font-weight:700}

/* ===== Device detail ===== */
.detail-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.info-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--surface-2);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .k{color:var(--text-soft);font-weight:600}
.info-row .v{font-weight:600;text-align:left}
.qr-box{text-align:center;padding:10px}
.qr-box canvas,.qr-box img{border:8px solid #fff;border-radius:12px;box-shadow:var(--shadow);background:#fff}
.timeline{position:relative;padding-inline-start:22px}
.timeline::before{content:"";position:absolute;right:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;right:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--border)}
.tl-item .tl-date{font-size:11px;color:var(--text-mute)}
.tl-item .tl-text{font-size:13px;font-weight:600}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:17px}
.modal-head button{background:none;border:none;font-size:22px;color:var(--text-mute)}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start}

/* ===== Misc ===== */
.empty{text-align:center;padding:50px 20px;color:var(--text-mute)}
.empty .e-ico{font-size:46px;margin-bottom:10px}
.section-title{font-size:18px;font-weight:800;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
.section-title .count{font-size:13px;font-weight:600;color:var(--text-mute);background:var(--surface-2);padding:2px 10px;border-radius:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;transition:.3s;box-shadow:var(--shadow-lg);opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-soft);font-weight:600;margin-bottom:14px;font-size:13.5px}
.back-link:hover{color:var(--primary)}
.muted{color:var(--text-mute)}
.scanner-box{max-width:480px;margin:0 auto}
#qr-reader{border-radius:14px;overflow:hidden;border:1px solid var(--border)}

/* ===== QR sheet ===== */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.qr-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;break-inside:avoid}
.qr-card canvas{background:#fff;border-radius:8px}
.qr-label b{color:var(--primary);font-family:"Courier New",monospace;font-size:13px}
.qr-label .qr-name{font-size:13px;font-weight:700;margin-top:2px}
.qr-label .qr-dep{font-size:11px}
@media print{
  .qr-grid{grid-template-columns:repeat(4,1fr);gap:10px}
  .qr-card{box-shadow:none;border:1px solid #ccc}
}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#1e3a8a,#0f172a);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:38px 34px;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
.login-card .lc-logo{text-align:center;font-size:46px;margin-bottom:10px}
.login-card h1{text-align:center;font-size:21px;margin-bottom:4px}
.login-card p.sub{text-align:center;color:var(--text-soft);margin-bottom:26px;font-size:13px}
.login-card .field{margin-bottom:15px}
.login-card .btn{width:100%;justify-content:center;padding:12px}
.login-hint{margin-top:18px;font-size:12px;color:var(--text-mute);background:var(--surface-2);padding:12px;border-radius:10px;line-height:1.8}

/* ===== Responsive ===== */
@media(max-width:900px){
  .grid-2{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .sidebar{position:fixed;right:0;z-index:60;transform:translateX(100%);transition:.25s}
  .sidebar.open{transform:translateX(0)}
  .topbar .menu-toggle{display:block}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .sidebar-backdrop.open{display:block}
  .content{padding:18px}
  .topbar{padding:12px 16px}
}
@media print{
  .sidebar,.topbar,.no-print,.btn{display:none!important}
  .content{padding:0;max-width:none}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
}

</style>
</head>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:

// DENSO WAVE INCORPORATED

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {

<script>
/* ============================================================
   db.js — Data layer
   Structured data  -> localStorage
   Certificate files -> IndexedDB (so large PDFs/images don't
   blow the localStorage quota)
   ============================================================ */
const DB = (() => {
  const LS_KEY = 'labcal:data:v1';
  const SOON_DAYS = 60;            // "expiring soon" window (days)

  /* ---------- structured store ---------- */
  let store = null;

  const SCHEMA = 2;                 // bump when seed classification changes

  function load() {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { try { store = JSON.parse(raw); } catch { store = null; } }
    if (!store || !store.devices) seed();
    else migrate();
    return store;
  }

  // Non-destructive migrations for data cached from an older version.
  function migrate() {
    const from = store.schema || 1;
    if (from < 2) {
      // All workbook devices are auxiliary/supporting equipment.
      const seedIds = new Set((typeof SEED_DEVICES !== 'undefined' ? SEED_DEVICES : []).map(d => d.id));
      store.devices.forEach(d => { if (seedIds.has(d.id)) d.category = 'supporting'; });
    }
    if ((store.schema || 1) !== SCHEMA) { store.schema = SCHEMA; persist(); }
  }
  function persistSeed() { store.schema = SCHEMA; persist(); }
  function persist() { localStorage.setItem(LS_KEY, JSON.stringify(store)); }

  function seed() {
    store = {
      departments: structuredClone(SEED_DEPARTMENTS),
      devices: structuredClone(SEED_DEVICES).map(d => ({ ...d, history: [
        { date: today(), text: 'تمت إضافة الجهاز إلى النظام', user: 'system' }
      ]})),
      settings: { soonDays: SOON_DAYS, labName: 'مختبر سلامة الغذاء' },
      seededAt: new Date().toISOString(),
      schema: SCHEMA
    };
    persist();
  }
  function resetAll() { localStorage.removeItem(LS_KEY); store = null; load(); }

  /* ---------- date helpers ---------- */
  function parseDate(s) {
    if (!s) return null;
    // dd/mm/yyyy
    const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  function today() {
    const d = new Date();
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  function daysUntil(dateStr) {
    const d = parseDate(dateStr); if (!d) return null;
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.round((d - t) / 86400000);
  }
  function fmtDate(s){ return s || '—'; }

  /* ---------- calibration status ---------- */
  function status(device) {
    const days = daysUntil(device.dueDate);
    if (days === null) return 'unknown';
    if (days < 0) return 'expired';
    if (days <= (store.settings?.soonDays ?? SOON_DAYS)) return 'soon';
    return 'valid';
  }
  const STATUS_LABEL = { valid:'سارية', soon:'تنتهي قريباً', expired:'منتهية', unknown:'غير محددة' };
  const COND_LABEL   = { operational:'تعمل', maintenance:'تحت الصيانة', out_of_service:'خارج الخدمة' };

  /* ---------- departments ---------- */
  const departments = () => store.departments;
  const department  = (id) => store.departments.find(d => d.id === id || d.slug === id);
  function addDepartment(dep){
    dep.id = dep.id || slugify(dep.nameEn || dep.nameAr);
    store.departments.push(dep); persist(); return dep;
  }
  function updateDepartment(id, patch){
    const d = department(id); if(!d) return; Object.assign(d, patch); persist(); return d;
  }
  function deleteDepartment(id){
    store.departments = store.departments.filter(d => d.id !== id);
    store.devices = store.devices.filter(d => d.departmentId !== id);
    persist();
  }

  /* ---------- devices ---------- */
  const devices = () => store.devices;
  const device  = (id) => store.devices.find(d => d.id === id);
  const devicesByDept = (deptId) => store.devices.filter(d => d.departmentId === deptId);

  function addDevice(dev, user='—'){
    dev.id = dev.id || uniqueId(dev.newCode || dev.oldCode || dev.name || 'dev');
    dev.history = [{ date: today(), text: 'تمت إضافة الجهاز', user }];
    dev.condition = dev.condition || 'operational';
    store.devices.push(dev); persist(); return dev;
  }
  function updateDevice(id, patch, user='—', note){
    const d = device(id); if(!d) return;
    Object.assign(d, patch);
    if (note){ d.history = d.history || []; d.history.unshift({ date: today(), text: note, user }); }
    persist(); return d;
  }
  function deleteDevice(id){
    store.devices = store.devices.filter(d => d.id !== id); persist();
  }
  function logHistory(id, text, user='—'){
    const d = device(id); if(!d) return;
    d.history = d.history || []; d.history.unshift({ date: today(), text, user }); persist();
  }

  /* ---------- aggregate stats ---------- */
  function stats(list = store.devices){
    const s = { total:list.length, valid:0, soon:0, expired:0, unknown:0,
                main:0, supporting:0, operational:0, maintenance:0, out_of_service:0 };
    list.forEach(d => {
      s[status(d)]++;
      s[d.category === 'main' ? 'main' : 'supporting']++;
      s[d.condition || 'operational']++;
    });
    return s;
  }
  function alerts(){
    return store.devices
      .map(d => ({ d, st: status(d), days: daysUntil(d.dueDate) }))
      .filter(x => x.st === 'expired' || x.st === 'soon')
      .sort((a,b) => (a.days ?? 1e9) - (b.days ?? 1e9));
  }

  /* ---------- helpers ---------- */
  function slugify(s){ return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'item'; }
  function uniqueId(base){
    let id = slugify(base), n = 1;
    const exists = x => store.devices.some(d => d.id === x);
    let cur = id; while (exists(cur)) { n++; cur = `${id}-${n}`; }
    return cur;
  }

  /* ============================================================
     Certificate files — IndexedDB
     ============================================================ */
  const IDB_NAME = 'labcal-certs', IDB_STORE = 'files';
  let idbPromise = null;
  function idb(){
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((res, rej) => {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return idbPromise;
  }
  async function saveCertificate(id, blob, filename, type){
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put({ blob, filename, type, savedAt: Date.now() }, id);
      tx.oncomplete = () => res(id); tx.onerror = () => rej(tx.error);
    });
  }
  async function getCertificate(id){
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const rq = tx.objectStore(IDB_STORE).get(id);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error);
    });
  }
  async function deleteCertificate(id){
    const db = await idb();
    return new Promise((res) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id); tx.oncomplete = res;
    });
  }

  load();
  return {
    load, persist, resetAll, seedReset: resetAll,
    parseDate, today, daysUntil, fmtDate, status, STATUS_LABEL, COND_LABEL, SOON_DAYS,
    departments, department, addDepartment, updateDepartment, deleteDepartment,
    devices, device, devicesByDept, addDevice, updateDevice, deleteDevice, logHistory,
    stats, alerts, slugify, uniqueId,
    saveCertificate, getCertificate, deleteCertificate,
    get settings(){ return store.settings; },
    saveSettings(p){ Object.assign(store.settings, p); persist(); }
  };
})();

</script>
<script>
/* ============================================================
   auth.js — Local user accounts, roles & permissions
   NOTE: This is a client-side demo auth (passwords are lightly
   hashed, not cryptographically secure). For production, pair the
   UI with a real backend / identity provider.
   ============================================================ */
const Auth = (() => {
  const UKEY = 'labcal:users:v1';
  const SKEY = 'labcal:session:v1';

  const ROLES = {
    admin:      { label: 'مدير النظام',  desc: 'صلاحيات كاملة + إدارة المستخدمين والأقسام' },
    technician: { label: 'فني مختبر',    desc: 'إضافة وتعديل الأجهزة ورفع الشهادات وتحديث الحالة' },
    viewer:     { label: 'مشاهد',        desc: 'عرض البيانات والتقارير فقط' }
  };

  // permission -> roles allowed
  const PERMS = {
    'device.create':  ['admin','technician'],
    'device.edit':    ['admin','technician'],
    'device.delete':  ['admin'],
    'device.status':  ['admin','technician'],   // update condition / scan
    'cert.upload':    ['admin','technician'],
    'cert.delete':    ['admin'],
    'dept.manage':    ['admin'],
    'user.manage':    ['admin'],
    'settings.manage':['admin'],
    'report.view':    ['admin','technician','viewer'],
  };

  function hash(s){ // tiny non-secure hash, just to avoid plaintext at rest
    let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0;
    return 'h' + (h>>>0).toString(36);
  }

  function users(){
    let u = null;
    try { u = JSON.parse(localStorage.getItem(UKEY)); } catch {}
    if (!u || !u.length){
      u = [
        { id:'admin', username:'admin', name:'مدير النظام', role:'admin', pass:hash('admin123'), createdAt:Date.now() },
        { id:'tech',  username:'tech',  name:'فني المعايرة', role:'technician', pass:hash('tech123'),  createdAt:Date.now() },
        { id:'view',  username:'viewer',name:'مراجع الجودة', role:'viewer', pass:hash('view123'),  createdAt:Date.now() },
      ];
      localStorage.setItem(UKEY, JSON.stringify(u));
    }
    return u;
  }
  function saveUsers(list){ localStorage.setItem(UKEY, JSON.stringify(list)); }

  function login(username, password){
    const u = users().find(x => x.username.toLowerCase() === String(username).toLowerCase());
    if (!u || u.pass !== hash(password)) return null;
    const session = { id:u.id, username:u.username, name:u.name, role:u.role, at:Date.now() };
    localStorage.setItem(SKEY, JSON.stringify(session));
    return session;
  }
  function logout(){ localStorage.removeItem(SKEY); }
  function current(){ try { return JSON.parse(localStorage.getItem(SKEY)); } catch { return null; } }

  function can(perm){
    const u = current(); if (!u) return false;
    const roles = PERMS[perm]; return roles ? roles.includes(u.role) : false;
  }

  function addUser({ username, name, role, password }){
    const list = users();
    if (list.some(u => u.username.toLowerCase() === username.toLowerCase()))
      throw new Error('اسم المستخدم موجود مسبقاً');
    const u = { id:'u'+Date.now().toString(36), username, name, role, pass:hash(password||'123456'), createdAt:Date.now() };
    list.push(u); saveUsers(list); return u;
  }
  function updateUser(id, patch){
    const list = users(); const u = list.find(x => x.id === id); if (!u) return;
    if (patch.password){ u.pass = hash(patch.password); delete patch.password; }
    Object.assign(u, patch); saveUsers(list);
    const cur = current(); if (cur && cur.id === id){ cur.name=u.name; cur.role=u.role; localStorage.setItem(SKEY, JSON.stringify(cur)); }
    return u;
  }
  function deleteUser(id){
    if (id === 'admin') throw new Error('لا يمكن حذف حساب المدير الأساسي');
    saveUsers(users().filter(u => u.id !== id));
  }

  return { ROLES, PERMS, users, login, logout, current, can, addUser, updateUser, deleteUser, roleLabel:(r)=>ROLES[r]?.label||r };
})();

</script>

/* ============================================================
   app.js — SPA router + views
   ============================================================ */
'use strict';

/* ---------- tiny DOM + utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = (o) => Object.entries(o).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');

function toast(msg, kind=''){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className='toast', 2600);
}
function go(hash){ location.hash = hash; }

const ICONS = {
  dashboard:'📊', dept:'🏢', devices:'🔬', scan:'📷', reports:'📈', users:'👥', settings:'⚙️', cert:'📄', alert:'🔔'
};

function statusBadge(st){
  return `<span class="badge ${st}">${st==='valid'?'✅':st==='soon'?'⏳':st==='expired'?'⛔':'❔'} ${DB.STATUS_LABEL[st]}</span>`;
}
function condBadge(c){
  c = c || 'operational';
  const ic = { operational:'🟢', maintenance:'🛠️', out_of_service:'🔴' }[c];
  return `<span class="badge cond-${c}">${ic} ${DB.COND_LABEL[c]}</span>`;
}
function catBadge(cat){
  return cat==='main'
    ? '<span class="badge main">⭐ رئيسي</span>'
    : '<span class="badge supporting">🔧 مساند</span>';
}

/* ---------- modal ---------- */
function modal({ title, body, footer, onOpen }){
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal-overlay open" id="m-ov">
      <div class="modal">
        <div class="modal-head"><h3>${title}</h3><button id="m-x">×</button></div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>
    </div>`;
  const close = () => { root.innerHTML=''; };
  $('#m-x').onclick = close;
  $('#m-ov').onclick = (e)=>{ if(e.target.id==='m-ov') close(); };
  if (onOpen) onOpen(close);
  return close;
}

/* ============================================================
   Router
   ============================================================ */
const routes = [
  [/^\/login$/,                () => viewLogin()],
  [/^\/$/,                     () => layout(viewDashboard)],
  [/^\/departments$/,          () => layout(viewDepartments)],
  [/^\/dept\/([^/]+)$/,        (m) => layout(() => viewDepartment(m[1]))],
  [/^\/device\/([^/]+)\/edit$/,(m) => layout(() => viewDeviceForm(m[1]))],
  [/^\/device\/([^/]+)$/,      (m) => layout(() => viewDevice(m[1]))],
  [/^\/add-device$/,           () => layout(() => viewDeviceForm(null))],
  [/^\/scan$/,                 () => layout(viewScan)],
  [/^\/qrcodes$/,              () => layout(viewQRSheet)],
  [/^\/reports$/,              () => layout(viewReports)],
  [/^\/users$/,                () => layout(viewUsers)],
  [/^\/settings$/,             () => layout(viewSettings)],
];

function router(){
  const path = (location.hash.replace(/^#/, '') || '/');
  if (!Auth.current() && path !== '/login') return go('/login');
  if (Auth.current() && path === '/login') return go('/');
  for (const [re, fn] of routes){
    const m = path.match(re);
    if (m){ fn(m); window.scrollTo(0,0); return; }
  }
  layout(() => `<div class="empty"><div class="e-ico">🤷</div><h3>الصفحة غير موجودة</h3></div>`);
}
window.addEventListener('hashchange', router);
window.addEventListener('load', router);

   Layout shell (sidebar + topbar)
   ============================================================ */
function navItems(){
  const a = DB.alerts().length;
  return [
    { sec:'الرئيسية' },
    { href:'#/',            ico:ICONS.dashboard, label:'لوحة التحكم' },
    { href:'#/departments', ico:ICONS.dept,      label:'الأقسام والأجهزة' },
    { href:'#/scan',        ico:ICONS.scan,      label:'مسح QR' },
    { href:'#/qrcodes',     ico:'🏷️',           label:'رموز QR' },
    { href:'#/reports',     ico:ICONS.reports,   label:'التقارير' },
    { sec:'الإدارة' },
    { href:'#/users',       ico:ICONS.users,     label:'المستخدمون', perm:'user.manage' },
    { href:'#/settings',    ico:ICONS.settings,  label:'الإعدادات',  perm:'settings.manage' },
    { spacerAlert:a },
  ];
}

function layout(viewFn){
  const u = Auth.current();
  const path = location.hash.replace(/^#/, '') || '/';
  const alertCount = DB.alerts().length;

  const nav = navItems().map(it => {
    if (it.sec) return `<div class="nav-section">${it.sec}</div>`;
    if (it.spacerAlert !== undefined) return '';
    if (it.perm && !Auth.can(it.perm)) return '';
    const active = ('#'+path) === it.href || (it.href !== '#/' && ('#'+path).startsWith(it.href)) ? 'active' : '';
    const pill = (it.href === '#/' && alertCount) ? `<span class="pill">${alertCount}</span>` : '';
    return `<a href="${it.href}" class="${active}"><span class="ico">${it.ico}</span>${it.label}${pill}</a>`;
  }).join('');

  const titleMap = { '/':'لوحة التحكم', '/departments':'الأقسام والأجهزة', '/scan':'مسح رمز QR',
                     '/qrcodes':'رموز QR', '/reports':'التقارير', '/users':'المستخدمون', '/settings':'الإعدادات' };
  let pageTitle = titleMap[path] || '';
  if (path.startsWith('/dept/')) pageTitle = 'تفاصيل القسم';
  else if (path.startsWith('/device/') && path.endsWith('/edit')) pageTitle = 'تعديل جهاز';
  else if (path.startsWith('/device/')) pageTitle = 'تفاصيل الجهاز';
  else if (path === '/add-device') pageTitle = 'إضافة جهاز';

  $('#app').innerHTML = `
    <div class="app">
      <div class="sidebar-backdrop" id="sb-back"></div>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="logo">🔬</span>
          <div><h1>منصة المعايرة</h1><p>إدارة أجهزة المختبر</p></div>
        </div>
        <nav class="nav">${nav}</nav>
        <div class="userbox">
          <div class="avatar">${esc((u.name||'?').slice(0,1))}</div>
          <div class="meta"><b>${esc(u.name)}</b><span>${esc(Auth.roleLabel(u.role))}</span></div>
          <button id="logout" title="تسجيل الخروج">⏻</button>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button class="menu-toggle" id="menu-t">☰</button>
          <h2>${esc(pageTitle)}</h2>
          <div class="search">
            <span class="si">🔍</span>
            <input id="gsearch" placeholder="ابحث باسم الجهاز، الكود، الرقم التسلسلي، الشهادة...">
            <div class="search-results" id="sresults"></div>
          </div>
        </header>
        <main class="content" id="content"></main>
      </div>
    </div>`;

  $('#logout').onclick = () => { Auth.logout(); go('/login'); };
  $('#menu-t').onclick = () => { $('#sidebar').classList.toggle('open'); $('#sb-back').classList.toggle('open'); };
  $('#sb-back').onclick = () => { $('#sidebar').classList.remove('open'); $('#sb-back').classList.remove('open'); };
  setupSearch();

  const out = viewFn();
  if (typeof out === 'string') $('#content').innerHTML = out;
  // (view functions that need post-render JS handle it themselves)
}

/* ---------- global search ---------- */
function setupSearch(){
  const inp = $('#gsearch'), box = $('#sresults');
  if (!inp) return;
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2){ box.style.display='none'; return; }
    const res = DB.devices().filter(d =>
      [d.name,d.newCode,d.oldCode,d.serial,d.certNumber,d.manufacturer,d.model]
        .some(v => String(v||'').toLowerCase().includes(q))).slice(0,8);
    box.innerHTML = res.length ? res.map(d => {
      const st = DB.status(d);
      return `<a href="#/device/${d.id}" onclick="$('#sresults').style.display='none'">
        <div><div style="font-weight:700">${esc(d.name)}</div>
        <div class="muted" style="font-size:12px">${esc(d.newCode||d.oldCode)} • ${esc(d.serial||'—')}</div></div>
        ${statusBadge(st)}</a>`;
    }).join('') : `<div style="padding:14px" class="muted">لا توجد نتائج</div>`;
    box.style.display='block';
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.search')) box.style.display='none';
  });
}

function pct(a,b){ return b ? Math.round(a/b*100) : 0; }

function deptCard(dept){
  const list = DB.devicesByDept(dept.id);
  const st = DB.stats(list);
  return `<a href="#/dept/${dept.id}" class="dept-card" style="border-top-color:${dept.color}">
    <span class="dico">${dept.icon}</span>
    <h3>${esc(dept.nameAr)}</h3>
    <div class="en">${esc(dept.nameEn)}</div>
    <div class="row">
      <span><b>${list.length}</b>جهاز</span>
      <span><b style="color:var(--green)">${st.valid}</b>سارية</span>
      <span><b style="color:var(--amber)">${st.soon}</b>قريبة</span>
      <span><b style="color:var(--red)">${st.expired}</b>منتهية</span>
    </div>
  </a>`;
}

let _charts = {};
function drawStatusChart(s){
  const c = $('#statusChart'); if (!c || !window.Chart) return;
  _charts.status?.destroy();
  _charts.status = new Chart(c, {
    type:'doughnut',
    data:{ labels:['سارية','تنتهي قريباً','منتهية','غير محددة'],
      datasets:[{ data:[s.valid,s.soon,s.expired,s.unknown],
        backgroundColor:['#16a34a','#d97706','#dc2626','#cbd5e1'], borderWidth:2, borderColor:'#fff' }] },
    options:{ plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Tahoma' }, padding:14 } } }, cutout:'62%' }
  });
}
function drawDeptChart(){
  const c = $('#deptChart'); if (!c || !window.Chart) return;
  const depts = DB.departments();
  _charts.dept?.destroy();
  _charts.dept = new Chart(c, {
    type:'bar',
    data:{ labels:depts.map(d=>d.nameAr),
      datasets:[
        { label:'سارية', data:depts.map(d=>DB.stats(DB.devicesByDept(d.id)).valid), backgroundColor:'#16a34a' },
        { label:'قريبة', data:depts.map(d=>DB.stats(DB.devicesByDept(d.id)).soon),  backgroundColor:'#d97706' },
        { label:'منتهية',data:depts.map(d=>DB.stats(DB.devicesByDept(d.id)).expired),backgroundColor:'#dc2626' },
      ]},
    options:{ responsive:true, scales:{ x:{ stacked:true, ticks:{ font:{ family:'Tahoma' } } }, y:{ stacked:true, beginAtZero:true } },
      plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Tahoma' } } } } }
  });
}

function deptModal(dept){
  const edit = !!dept;
  modal({
    title: edit ? 'تعديل قسم' : 'إضافة قسم جديد',
    body: `<div class="form-grid">
      <div class="field full req"><label>الاسم بالعربية</label><input id="d-ar" value="${esc(dept?.nameAr||'')}"></div>
      <div class="field full"><label>الاسم بالإنجليزية</label><input id="d-en" value="${esc(dept?.nameEn||'')}"></div>
      <div class="field"><label>الأيقونة (إيموجي)</label><input id="d-ico" value="${esc(dept?.icon||'🧫')}"></div>
      <div class="field"><label>اللون</label><input id="d-color" type="color" value="${esc(dept?.color||'#2563eb')}"></div>
    </div>`,
    footer: `<button class="btn btn-primary" id="d-save">حفظ</button>
             ${edit?`<button class="btn btn-danger" id="d-del">حذف القسم</button>`:''}
             <button class="btn btn-ghost" id="d-cancel">إلغاء</button>`,
    onOpen: (close) => {
      $('#d-cancel').onclick = close;
      $('#d-save').onclick = () => {
        const nameAr = $('#d-ar').value.trim(); if (!nameAr) return toast('أدخل اسم القسم','err');
        const data = { nameAr, nameEn:$('#d-en').value.trim(), icon:$('#d-ico').value.trim()||'🧫', color:$('#d-color').value };
        if (edit) DB.updateDepartment(dept.id, data); else DB.addDepartment(data);
        close(); toast('تم الحفظ','ok'); router();
      };
      if (edit) $('#d-del').onclick = () => {
        if (confirm('حذف القسم سيحذف جميع أجهزته. متابعة؟')){ DB.deleteDepartment(dept.id); close(); toast('تم حذف القسم','ok'); go('/departments'); }
      };
    }
  });
}

  const list = DB.devicesByDept(dept.id);

  const section = (title, icon, items) => `

      : `<div class="card"><div class="empty"><div class="e-ico">📭</div>لا توجد أجهزة في هذا القسم</div></div>`}`;

  return `

        ${Auth.can('dept.manage')?`<button class="btn btn-ghost" id="edit-dept">✏️ تعديل القسم</button>`:''}
        ${Auth.can('device.create')?`<a href="#/add-device?${qs({dept:dept.id})}" class="btn btn-primary">＋ إضافة جهاز</a>`:''}
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat blue"><div class="icon">🔬</div><div class="label">إجمالي الأجهزة</div><div class="num">${list.length}</div></div>
      <div class="stat green"><div class="icon">✅</div><div class="label">سارية</div><div class="num">${st.valid}</div></div>
      <div class="stat amber"><div class="icon">⏳</div><div class="label">تنتهي قريباً</div><div class="num">${st.soon}</div></div>
      <div class="stat red"><div class="icon">⛔</div><div class="label">منتهية</div><div class="num">${st.expired}</div></div>
    </div>
    ${section('الأجهزة الرئيسية','⭐', main)}
    ${section('الأجهزة المساندة','🔧', support)}`;
}

    <thead><tr>
      <th>الكود</th><th>اسم الجهاز</th><th>الرقم التسلسلي</th><th>الفحص</th>
      <th>تاريخ الانتهاء</th><th>الحالة</th><th>التشغيل</th><th></th>
    </tr></thead><tbody>
    ${items.map(d => {
      const st = DB.status(d);
      return `<tr>
        <td class="code">${esc(d.newCode||d.oldCode||'—')}</td>
        <td><b>${esc(d.name)}</b><br><span class="muted" style="font-size:12px">${esc(d.manufacturer||'')}</span></td>
        <td>${esc(d.serial||'—')}</td>
        <td>${esc(d.test||'—')}</td>
        <td>${esc(d.dueDate||'—')}</td>
        <td>${statusBadge(st)}</td>
        <td>${condBadge(d.condition)}</td>
        <td><a href="#/device/${d.id}" class="btn btn-ghost btn-sm">عرض ←</a></td>
      </tr>`;
    }).join('')}
    </tbody></table>`;
}

   DEVICE DETAIL

function viewDevice(id){
  const d = DB.device(id);
  if (!d) { $('#content').innerHTML = `<div class="empty">الجهاز غير موجود</div>`; return; }
  const dept = DB.department(d.departmentId);
  const st = DB.status(d);
  const days = DB.daysUntil(d.dueDate);

  const rows = [
    ['القسم', dept ? `${dept.icon} ${esc(dept.nameAr)}` : '—'],
    ['الوحدة', esc(d.unit||'—')],

/* ---------- QR ---------- */
function deviceURL(id){
  // إن ضُبط "رابط الاستضافة" في الإعدادات، تُبنى رموز QR عليه ليفتحها الجوال.
  const base = (DB.settings.baseUrl || '').trim();
  if (base) return base.replace(/[#?].*$/, '').replace(/\/+$/, '') + '/#/device/' + id;
  // وإلا استخدم الموقع الحالي (يعمل عند الاستضافة على الويب؛ ومحلياً يعمل داخل نفس الجهاز فقط)
  return location.origin + location.pathname + '#/device/' + id;
}
function renderQR(d){
  const c = $('#qr'); if (!c || !window.QRCode) return;
  QRCode.toCanvas(c, deviceURL(d.id), { width:200, margin:1, color:{ dark:'#0f172a', light:'#ffffff' } }, ()=>{});
}
function downloadQR(id, label){
  const tmp = document.createElement('canvas');
  QRCode.toCanvas(tmp, deviceURL(id), { width:600, margin:2 }, () => {
    const a = document.createElement('a');
    a.href = tmp.toDataURL('image/png'); a.download = `QR-${label}.png`; a.click();
  });
}

/* ---------- certificate upload / view ---------- */
function uploadCertModal(d){
  modal({
    title:'رفع شهادة المعايرة',
    body:`<div class="field full"><label>اختر ملف (PDF أو صورة)</label>
      <input type="file" id="cert-file" accept="application/pdf,image/*"></div>
      <div class="field full"><label>رقم الشهادة (اختياري)</label><input id="cert-num" value="${esc(d.certNumber||'')}"></div>
      <p class="muted" style="font-size:12px">يُحفظ الملف محلياً في المتصفح (IndexedDB).</p>`,
    footer:`<button class="btn btn-primary" id="cert-save">رفع وحفظ</button><button class="btn btn-ghost" id="cert-cancel">إلغاء</button>`,
    onOpen:(close)=>{
      $('#cert-cancel').onclick = close;
      $('#cert-save').onclick = async () => {
        const f = $('#cert-file').files[0];
        if (!f) return toast('اختر ملفاً','err');
        if (f.size > 15*1024*1024) return toast('الحجم يتجاوز 15MB','err');
        await DB.saveCertificate(d.id, f, f.name, f.type);
        DB.updateDevice(d.id, { certificateId:d.id, certFile:f.name, certNumber:$('#cert-num').value.trim()||d.certNumber },
          Auth.current().name, `تم رفع شهادة معايرة: ${f.name}`);
        close(); toast('تم رفع الشهادة','ok'); viewDevice(d.id);
      };
    }
  });
}
async function viewCertificate(d){
  const rec = await DB.getCertificate(d.id);
  if (!rec){ toast('الملف غير متوفر','err'); return; }
  const url = URL.createObjectURL(rec.blob);
  const isPdf = (rec.type||'').includes('pdf') || /\.pdf$/i.test(rec.filename||'');
  modal({
    title:`شهادة: ${esc(rec.filename||'')}`,
    body: isPdf
      ? `<iframe src="${url}" style="width:100%;height:65vh;border:none;border-radius:10px"></iframe>`
      : `<img src="${url}" style="width:100%;border-radius:10px">`,
    footer:`<a class="btn btn-primary" href="${url}" download="${esc(rec.filename||'certificate')}">⬇️ تحميل</a>
            ${Auth.can('cert.delete')?`<button class="btn btn-danger" id="cert-del">🗑️ حذف الشهادة</button>`:''}
            <button class="btn btn-ghost" id="cert-close">إغلاق</button>`,
    onOpen:(close)=>{
      $('#cert-close').onclick = () => { URL.revokeObjectURL(url); close(); };
      if ($('#cert-del')) $('#cert-del').onclick = async () => {
        if (!confirm('حذف الشهادة؟')) return;
        await DB.deleteCertificate(d.id);
        DB.updateDevice(d.id, { certificateId:'', certFile:'' }, Auth.current().name, 'تم حذف شهادة المعايرة');
        close(); toast('تم الحذف','ok'); viewDevice(d.id);
      };
    }
  });
}

   ============================================================ */
let _scanner = null;
function viewScan(){
  setTimeout(startScanner, 50);
  return `
    <div class="page-head"><div><h1>مسح رمز QR</h1><p>وجّه الكاميرا نحو رمز الجهاز للوصول السريع وتحديث حالته</p></div></div>
    <div class="card scanner-box"><div class="card-body">
      <div id="qr-reader"></div>
      <div id="scan-msg" class="muted" style="text-align:center;margin-top:14px">جارٍ تشغيل الكاميرا...</div>
      <div style="margin-top:16px">
        <div class="field"><label>أو أدخل كود الجهاز يدوياً</label>
          <div style="display:flex;gap:8px">
            <input id="manual-code" placeholder="مثال: FCL-CC-763" style="flex:1;padding:10px 13px;border:1px solid var(--border);border-radius:10px">
            <button class="btn btn-primary" id="manual-go">بحث</button>
          </div>
        </div>
      </div>
    </div></div>`;
}
function stopScanner(){ if (_scanner){ try{ _scanner.stop(); }catch{}; _scanner=null; } }
function resolveScan(text){
  // accept full URL (…#/device/ID) or a code
  let id = null;
  const m = String(text).match(/#\/device\/([^/?#]+)/);
  if (m) id = m[1];
  let dev = id ? DB.device(id) : null;
  if (!dev){
    const q = String(text).trim().toLowerCase();
    dev = DB.devices().find(d => [d.id,d.newCode,d.oldCode,d.serial].some(v=>String(v||'').toLowerCase()===q));
  }
  return dev;
}
function startScanner(){
  $('#manual-go') && ($('#manual-go').onclick = () => {
    const dev = resolveScan($('#manual-code').value);
    if (dev){ go(`/device/${dev.id}`); } else toast('لم يُعثر على الجهاز','err');
  });
  if (!window.Html5Qrcode){ $('#scan-msg').textContent='مكتبة المسح غير متاحة (تحقق من الاتصال)'; return; }
  _scanner = new Html5Qrcode('qr-reader');
  _scanner.start({ facingMode:'environment' }, { fps:10, qrbox:240 },
    (text) => {
      const dev = resolveScan(text);
      stopScanner();
      if (dev){ toast('تم العثور على الجهاز','ok'); scanActionModal(dev); }
      else toast('رمز غير معروف: '+text, 'err');
    }, () => {}
  ).then(()=> $('#scan-msg').textContent='وجّه الكاميرا نحو رمز QR')
   .catch(()=> $('#scan-msg').innerHTML='تعذّر الوصول إلى الكاميرا — استخدم الإدخال اليدوي بالأسفل');
  window.addEventListener('hashchange', stopScanner, { once:true });
}
function scanActionModal(d){
  modal({
    title:`${d.name}`,
    body:`<div class="info-row"><span class="k">الكود</span><span class="v code">${esc(d.newCode||d.oldCode)}</span></div>
      <div class="info-row"><span class="k">المعايرة</span><span class="v">${statusBadge(DB.status(d))}</span></div>
      <div class="info-row"><span class="k">تنتهي</span><span class="v">${esc(d.dueDate||'—')}</span></div>
      ${Auth.can('device.status')?`<div class="field full" style="margin-top:14px"><label>تحديث حالة التشغيل</label>
        <select id="sc-cond">${Object.entries(DB.COND_LABEL).map(([k,v])=>`<option value="${k}" ${d.condition===k?'selected':''}>${v}</option>`).join('')}</select></div>`:''}`,
    footer:`${Auth.can('device.status')?`<button class="btn btn-primary" id="sc-save">حفظ الحالة</button>`:''}
      <a class="btn btn-ghost" href="#/device/${d.id}">عرض التفاصيل ←</a>
      <button class="btn btn-ghost" id="sc-rescan">مسح آخر</button>`,
    onOpen:(close)=>{
      $('#sc-rescan').onclick = () => { close(); startScanner(); };
      if ($('#sc-save')) $('#sc-save').onclick = () => {
        const c = $('#sc-cond').value;
        DB.updateDevice(d.id, { condition:c }, Auth.current().name, `تحديث الحالة عبر مسح QR إلى: ${DB.COND_LABEL[c]}`);
        close(); toast('تم تحديث الحالة','ok');

        ${depts.map(d=>`<option value="${d.id}">${esc(d.icon)} ${esc(d.nameAr)}</option>`).join('')}</select></div>
      <div class="field" style="min-width:160px"><label>التصنيف</label><select id="qr-cat">
        <option value="">الكل</option><option value="supporting">مساند</option><option value="main">رئيسي</option></select></div>
      <span class="muted" id="qr-count" style="padding-bottom:10px"></span>
    </div></div>
    <div id="qr-grid" class="qr-grid"></div>`;
}
function qrFilteredList(){
  const dept=$('#qr-dept').value, cat=$('#qr-cat').value;
  let list = DB.devices();
  if (dept) list = list.filter(d=>d.departmentId===dept);
  if (cat) list = list.filter(d=>(d.category||'supporting')===cat);
  return list;
}
function setupQRSheet(){
  const render = () => {
    const list = qrFilteredList();
    $('#qr-count').textContent = `${list.length} جهاز`;
    const grid = $('#qr-grid');
    grid.innerHTML = list.length ? list.map(d=>{
      const dep = DB.department(d.departmentId);
      return `<div class="qr-card">
        <canvas class="qr-c" data-id="${d.id}"></canvas>
        <div class="qr-label"><b>${esc(d.newCode||d.oldCode||'—')}</b>
          <div class="qr-name">${esc(d.name)}</div>
          <div class="qr-dep muted">${esc(dep?.nameAr||'')}${d.serial?(' • '+esc(d.serial)):''}</div></div>
        <button class="btn btn-ghost btn-sm no-print qr-dl" data-id="${d.id}" data-label="${esc(d.newCode||d.oldCode||d.id)}">⬇️ تحميل</button>
      </div>`;
    }).join('') : `<div class="empty"><div class="e-ico">🏷️</div>لا توجد أجهزة مطابقة</div>`;
    // draw QR canvases
    if (window.QRCode) $$('.qr-c', grid).forEach(c =>
      QRCode.toCanvas(c, deviceURL(c.dataset.id), { width:150, margin:1, color:{dark:'#0f172a',light:'#ffffff'} }, ()=>{}));
    $$('.qr-dl', grid).forEach(b => b.onclick = () => downloadQR(b.dataset.id, b.dataset.label));
  };
  $('#qr-dept').onchange = render;
  $('#qr-cat').onchange = render;
  $('#qr-print').onclick = () => window.print();
  $('#qr-zip').onclick = downloadAllQR;
  render();
}
// تحميل كل الرموز كصور PNG متتابعة
function downloadAllQR(){
  const list = qrFilteredList();
  if (!list.length) return toast('لا توجد أجهزة','err');
  if (!confirm(`سيتم تحميل ${list.length} صورة QR. متابعة؟`)) return;
  let i = 0;
  const next = () => {
    if (i >= list.length){ toast('تم تحميل كل الرموز','ok'); return; }
    const d = list[i++];
    const tmp = document.createElement('canvas');
    QRCode.toCanvas(tmp, deviceURL(d.id), { width:500, margin:2 }, () => {
      const a = document.createElement('a');
      a.href = tmp.toDataURL('image/png'); a.download = `QR-${(d.newCode||d.oldCode||d.id)}.png`; a.click();
      setTimeout(next, 250); // فاصل بسيط حتى لا يحجب المتصفح التنزيلات
    });
  };
  next();
}

   ============================================================ */
function viewReports(){
  setTimeout(setupReports, 0);
  const depts = DB.departments();
  return `
    <div class="page-head"><div><h1>التقارير</h1><p>تقارير الأجهزة والمعايرة مع إمكانية التصفية والتصدير</p></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost no-print" id="rep-print">🖨️ طباعة</button>
        <button class="btn btn-primary no-print" id="rep-csv">⬇️ تصدير CSV</button>
      </div></div>
    <div class="card no-print" style="margin-bottom:18px"><div class="card-body">
      <div class="form-grid">
        <div class="field"><label>القسم</label><select id="r-dept"><option value="">كل الأقسام</option>
          ${depts.map(d=>`<option value="${d.id}">${esc(d.nameAr)}</option>`).join('')}</select></div>
        <div class="field"><label>حالة المعايرة</label><select id="r-status">
          <option value="">الكل</option><option value="valid">سارية</option><option value="soon">تنتهي قريباً</option>
          <option value="expired">منتهية</option><option value="unknown">غير محددة</option></select></div>
        <div class="field"><label>التصنيف</label><select id="r-cat">
          <option value="">الكل</option><option value="main">رئيسي</option><option value="supporting">مساند</option></select></div>
        <div class="field"><label>بحث</label><input id="r-q" placeholder="اسم، كود، رقم تسلسلي..."></div>
      </div>
    </div></div>
    <div class="card"><div class="card-head"><h3 id="rep-title">تقرير الأجهزة</h3><span class="muted" id="rep-count"></span></div>
      <div class="table-wrap" id="rep-table"></div></div>`;
}
let _repRows = [];
function setupReports(){
  const render = () => {
    const dept=$('#r-dept').value, status=$('#r-status').value, cat=$('#r-cat').value, q=$('#r-q').value.trim().toLowerCase();
    let list = DB.devices();
    if (dept) list = list.filter(d=>d.departmentId===dept);
    if (cat) list = list.filter(d=>(d.category||'supporting')===cat);
    if (status) list = list.filter(d=>DB.status(d)===status);
    if (q) list = list.filter(d=>[d.name,d.newCode,d.oldCode,d.serial,d.certNumber,d.manufacturer].some(v=>String(v||'').toLowerCase().includes(q)));
    _repRows = list;
    $('#rep-count').textContent = `${list.length} جهاز`;
    $('#rep-table').innerHTML = list.length ? `<table class="tbl"><thead><tr>
      <th>القسم</th><th>الكود</th><th>الجهاز</th><th>التصنيف</th><th>الرقم التسلسلي</th><th>الفحص</th>
      <th>المعايرة</th><th>الانتهاء</th><th>الحالة</th></tr></thead><tbody>
      ${list.map(d=>{ const dep=DB.department(d.departmentId);
        return `<tr><td>${esc(dep?.nameAr||'')}</td><td class="code">${esc(d.newCode||d.oldCode)}</td>
        <td><a href="#/device/${d.id}"><b>${esc(d.name)}</b></a></td><td>${catBadge(d.category)}</td>
        <td>${esc(d.serial||'—')}</td><td>${esc(d.test||'—')}</td><td>${esc(d.calDate||'—')}</td>
        <td>${esc(d.dueDate||'—')}</td><td>${statusBadge(DB.status(d))}</td></tr>`;}).join('')}
      </tbody></table>` : `<div class="empty"><div class="e-ico">🔍</div>لا توجد نتائج مطابقة</div>`;
  };
  ['r-dept','r-status','r-cat'].forEach(id=>$('#'+id).onchange=render);
  $('#r-q').oninput = render;
  $('#rep-print').onclick = () => window.print();
  $('#rep-csv').onclick = exportCSV;
  render();
}
function exportCSV(){
  const head = ['القسم','الوحدة','التصنيف','الكود الجديد','الكود القديم','اسم الجهاز','المصنّع','الموديل','الرقم التسلسلي','الفحص','رقم الشهادة','جهة المعايرة','تاريخ المعايرة','تاريخ الانتهاء','الحالة','التشغيل','ملاحظات'];
  const rows = _repRows.map(d=>{ const dep=DB.department(d.departmentId);
    return [dep?.nameAr||'', d.unit||'', d.category==='main'?'رئيسي':'مساند', d.newCode||'', d.oldCode||'', d.name||'', d.manufacturer||'', d.model||'', d.serial||'', d.test||'', d.certNumber||'', d.calCompany||'', d.calDate||'', d.dueDate||'', DB.STATUS_LABEL[DB.status(d)], DB.COND_LABEL[d.condition||'operational'], (d.remarks||'').replace(/\n/g,' ')];
  });
  const csv = [head, ...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = `تقرير-الأجهزة-${DB.today().replace(/\//g,'-')}.csv`; a.click();
  toast('تم تصدير '+rows.length+' سجل','ok');
}

/* ============================================================
   USERS
   ============================================================ */
function viewUsers(){
  if (!Auth.can('user.manage')) return `<div class="empty">لا تملك صلاحية لهذه الصفحة</div>`;
  setTimeout(()=> { $('#add-user').onclick = () => userModal(); bindUserRows(); }, 0);
  const users = Auth.users();
  return `
    <div class="page-head"><div><h1>المستخدمون والصلاحيات</h1><p>إدارة حسابات النظام وأدوارها</p></div>
      <button class="btn btn-primary" id="add-user">＋ مستخدم جديد</button></div>
    <div class="grid-3" style="margin-bottom:22px">
      ${Object.entries(Auth.ROLES).map(([k,r])=>`<div class="card"><div class="card-body">
        <b>${esc(r.label)}</b><p class="muted" style="font-size:12.5px;margin-top:6px">${esc(r.desc)}</p>
        <div style="margin-top:8px" class="muted">${users.filter(u=>u.role===k).length} مستخدم</div></div></div>`).join('')}
    </div>
    <div class="card"><div class="table-wrap"><table class="tbl">
      <thead><tr><th>المستخدم</th><th>اسم الدخول</th><th>الدور</th><th>أنشئ في</th><th></th></tr></thead>
      <tbody>${users.map(u=>`<tr>
        <td><div style="display:flex;align-items:center;gap:10px"><span class="avatar" style="width:32px;height:32px;font-size:13px">${esc(u.name.slice(0,1))}</span><b>${esc(u.name)}</b></div></td>
        <td><code>${esc(u.username)}</code></td><td>${esc(Auth.roleLabel(u.role))}</td>
        <td class="muted">${new Date(u.createdAt).toLocaleDateString('ar')}</td>
        <td style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm u-edit" data-id="${u.id}">✏️</button>
          ${u.id!=='admin'?`<button class="btn btn-danger btn-sm u-del" data-id="${u.id}">🗑️</button>`:''}</td>
      </tr>`).join('')}</tbody></table></div></div>`;
}
function bindUserRows(){
  $$('.u-edit').forEach(b=> b.onclick = () => userModal(Auth.users().find(u=>u.id===b.dataset.id)));
  $$('.u-del').forEach(b=> b.onclick = () => {
    if (confirm('حذف هذا المستخدم؟')){ try{ Auth.deleteUser(b.dataset.id); toast('تم الحذف','ok'); router(); }catch(e){ toast(e.message,'err'); } }
  });
}
function userModal(user){
  const edit = !!user;
  modal({
    title: edit?'تعديل مستخدم':'مستخدم جديد',
    body:`<div class="form-grid">
      <div class="field full req"><label>الاسم</label><input id="u-name" value="${esc(user?.name||'')}"></div>
      <div class="field req"><label>اسم الدخول</label><input id="u-username" value="${esc(user?.username||'')}" ${edit?'disabled':''}></div>
      <div class="field req"><label>الدور</label><select id="u-role">
        ${Object.entries(Auth.ROLES).map(([k,r])=>`<option value="${k}" ${user?.role===k?'selected':''}>${esc(r.label)}</option>`).join('')}</select></div>
      <div class="field full"><label>${edit?'كلمة مرور جديدة (اتركها فارغة للإبقاء)':'كلمة المرور'}</label><input id="u-pass" type="text"></div>
    </div>`,
    footer:`<button class="btn btn-primary" id="u-save">حفظ</button><button class="btn btn-ghost" id="u-cancel">إلغاء</button>`,
    onOpen:(close)=>{
      $('#u-cancel').onclick = close;
      $('#u-save').onclick = () => {
        const name=$('#u-name').value.trim(), username=$('#u-username').value.trim(), role=$('#u-role').value, pass=$('#u-pass').value;
        if (!name||!username) return toast('أكمل الحقول','err');
        try {
          if (edit) Auth.updateUser(user.id, { name, role, ...(pass?{password:pass}:{}) });
          else { if (!pass) return toast('أدخل كلمة المرور','err'); Auth.addUser({ name, username, role, password:pass }); }
          close(); toast('تم الحفظ','ok'); router();
        } catch(e){ toast(e.message,'err'); }
      };
    }
  });
}

function viewSettings(){
  if (!Auth.can('settings.manage')) return `<div class="empty">لا تملك صلاحية لهذه الصفحة</div>`;
  setTimeout(()=> {
    $('#set-save').onclick = () => {
      DB.saveSettings({ labName:$('#s-lab').value.trim(), soonDays:Math.max(1,+$('#s-days').value||60), baseUrl:$('#s-baseurl').value.trim() });
      toast('تم حفظ الإعدادات','ok'); router();
    };
    $('#set-reset').onclick = () => {
      if (confirm('سيؤدي هذا إلى استعادة البيانات الأصلية من ملف المختبر وحذف تعديلاتك. متابعة؟')){
        DB.resetAll(); toast('تمت الاستعادة','ok'); go('/');
      }
    };
  },0);
  const s = DB.settings;
  return `
    <div class="page-head"><div><h1>الإعدادات</h1><p>تخصيص النظام</p></div></div>
    <div class="card" style="max-width:620px"><div class="card-body">
      <div class="form-grid">
        <div class="field full"><label>اسم المختبر</label><input id="s-lab" value="${esc(s.labName||'')}"></div>
        <div class="field"><label>فترة التنبيه قبل الانتهاء (أيام)</label><input id="s-days" type="number" min="1" value="${s.soonDays||60}">
          <span class="hint">يُعتبر الجهاز "تنتهي قريباً" خلال هذه المدة</span></div>
        <div class="field full"><label>رابط الاستضافة لرموز QR (Base URL)</label>
          <input id="s-baseurl" value="${esc(s.baseUrl||'')}" placeholder="https://username.github.io/lab-system-3/lab-platform.html" dir="ltr">
          <span class="hint">اكتبي رابط المنصة بعد نشرها على الإنترنت. عندها يفتح تصوير QR من الجوال صفحة الجهاز مباشرةً. اتركيه فارغاً للاستخدام داخل نفس الجهاز فقط.</span></div>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px">
        <button class="btn btn-primary" id="set-save">حفظ الإعدادات</button>
      </div>
      <hr style="margin:24px 0;border:none;border-top:1px solid var(--border)">
      <h3 style="margin-bottom:8px">منطقة الخطر</h3>
      <p class="muted" style="font-size:13px;margin-bottom:12px">استعادة البيانات الأصلية من ملف المختبر (يحذف كل التعديلات والأجهزة المضافة).</p>
      <button class="btn btn-danger" id="set-reset">♻️ استعادة البيانات الأصلية</button>
    </div></div>`;
}

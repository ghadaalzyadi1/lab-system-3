<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القسم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-header">
  <button class="back-btn" onclick="history.back()">← رجوع</button>
  <h1 id="dept-title">جاري التحميل...</h1>
  <div style="display:flex;gap:8px;margin-right:auto;flex-wrap:wrap">
    <a href="pdf-reader.html" class="btn-secondary">📄 رفع شهادة PDF</a>
    <a href="add-device.html" class="btn-primary">+ إضافة جهاز</a>
  </div>
</div>

<!-- بحث داخل القسم -->
<div style="background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:12px 24px">
  <div style="max-width:1200px;margin:0 auto">
    <input id="search" type="text" placeholder="🔍 ابحث في هذا القسم..." oninput="doSearch()"
      style="width:100%;max-width:400px;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;direction:rtl;font-family:inherit;outline:none">
  </div>
</div>

<div class="container">
  <div class="filters" style="margin-bottom:20px">
    <button class="filter-btn active" onclick="setFilter('all',this)">الكل</button>
    <button class="filter-btn" onclick="setFilter('primary',this)">🔧 رئيسية</button>
    <button class="filter-btn" onclick="setFilter('support',this)">🔩 مساندة</button>
    <button class="filter-btn" onclick="setFilter('alert',this)">⚠️ تحتاج انتباه</button>
  </div>

  <div id="primary-section">
    <h2 class="section-title">🔧 الأجهزة الرئيسية <span id="primary-count" style="font-size:13px;color:#94a3b8;font-weight:400"></span></h2>
    <div class="devices-grid" id="primary-list"></div>
  </div>

  <div id="support-section" style="margin-top:28px">
    <h2 class="section-title">🔩 الأجهزة المساندة <span id="support-count" style="font-size:13px;color:#94a3b8;font-weight:400"></span></h2>
    <div class="devices-grid" id="support-list"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
const slug = new URLSearchParams(location.search).get('slug');
let allDevices = [];

const statusMap = {
  valid:         { label:'ساري',           cls:'badge-valid'   },
  expiring_soon: { label:'ينتهي قريباً',   cls:'badge-soon'    },
  expired:       { label:'منتهي الصلاحية', cls:'badge-expired' },
};

function deviceCard(d) {
  const s = statusMap[d.calibration_status] || statusMap.valid;
  const typeLabel = d.device_type==='primary'
    ? '<span class="badge badge-primary">رئيسي</span>'
    : '<span class="badge badge-support">مساند</span>';
  return `
    <a href="device.html?id=${d.id}" class="device-card">
      <div class="device-header">
        <span class="device-name">${d.name}</span>
        <span class="badge ${s.cls}">${s.label}</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        ${typeLabel}
        <span style="font-size:11px;color:#64748b;padding:3px 8px;background:#f8fafc;border-radius:6px">${d.quality_code||''}</span>
      </div>
      <p class="device-meta" style="margin-top:6px">S/N: ${d.serial_number}</p>
      ${d.next_calibration_date ? `<p class="device-date">📅 المعايرة القادمة: ${new Date(d.next_calibration_date).toLocaleDateString('ar-SA')}</p>` : ''}
    </a>`;
}

function renderLists(devices) {
  const primary = devices.filter(d => d.device_type==='primary');
  const support  = devices.filter(d => d.device_type==='support');

  document.getElementById('primary-section').style.display = primary.length?'block':'none';
  document.getElementById('support-section').style.display = support.length?'block':'none';
  document.getElementById('primary-count').textContent = primary.length ? `(${primary.length})` : '';
  document.getElementById('support-count').textContent = support.length  ? `(${support.length})` : '';

  document.getElementById('primary-list').innerHTML = primary.length
    ? primary.map(deviceCard).join('')
    : '<p style="color:#94a3b8;font-size:13px;padding:10px">لا توجد أجهزة رئيسية</p>';
  document.getElementById('support-list').innerHTML = support.length
    ? support.map(deviceCard).join('')
    : '<p style="color:#94a3b8;font-size:13px;padding:10px">لا توجد أجهزة مساندة</p>';
}

function setFilter(f, btn) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  let list = allDevices;
  if (f==='primary') list = allDevices.filter(d=>d.device_type==='primary');
  if (f==='support')  list = allDevices.filter(d=>d.device_type==='support');
  if (f==='alert')    list = allDevices.filter(d=>d.calibration_status!=='valid');
  renderLists(list);
}

function doSearch() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = q ? allDevices.filter(d =>
    d.name?.toLowerCase().includes(q) ||
    d.serial_number?.toLowerCase().includes(q) ||
    d.quality_code?.toLowerCase().includes(q)
  ) : allDevices;
  renderLists(list);
}

async function load() {
  const { data: dept } = await db.from('departments').select('*').eq('slug', slug).single();
  if (!dept) { document.getElementById('dept-title').textContent='القسم غير موجود'; return; }
  document.title = dept.name_ar;
  document.getElementById('dept-title').textContent = dept.name_ar;
  const { data: devs } = await db.from('devices').select('*').eq('department_id', dept.id).order('name');
  allDevices = devs || [];
  renderLists(allDevices);
}
load();
</script>
</body>
</html>
